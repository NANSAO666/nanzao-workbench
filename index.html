// 渲染带品牌图标的模型选择器（统一组件，供所有AI模块复用）
// currentVendor: 当前选中的vendor key
// onChangeFn: 选择变化时的回调函数名（字符串）
// extraAttrs: 额外HTML属性
function renderModelSelector(currentVendor, onChangeFn, extraAttrs) {
  if (!appData.workflowApiKeys) appData.workflowApiKeys = {};
  const vendors = typeof API_VENDORS !== 'undefined' ? API_VENDORS : [];
  const selected = vendors.find(v => v.key === currentVendor) || vendors[0] || {};
  const selIcon = getVendorIconSVG(selected.key);
  const selLabel = selected.name || '选择模型';
  const selModel = (appData.workflowApiKeys[currentVendor] && appData.workflowApiKeys[currentVendor].model) || selected.model || '';

  const optsHTML = vendors.map(v => {
    const c = appData.workflowApiKeys[v.key] || {};
    const configured = c.key ? '<span style="color:#22c55e;">●</span>' : '<span style="color:#6b7280;">○</span>';
    const icon = getVendorIconSVG(v.key);
    const modelLabel = c.model || v.model || '';
    return `<div class="model-select-option" data-vendor="${v.key}" onclick="${onChangeFn}('${v.key}', this)">
      <div class="model-select-icon">${icon}</div>
      <div class="model-select-info">
        <div class="model-select-name">${configured} ${v.name}</div>
        ${modelLabel ? `<div class="model-select-model">${modelLabel}</div>` : ''}
      </div>
      ${v.key === currentVendor ? '<div class="model-select-check">✓</div>' : ''}
    </div>`;
  }).join('');

  return `
    <div class="custom-model-select" ${extraAttrs || ''}>
      <div class="custom-model-select-trigger" onclick="toggleModelSelect(this)">
        <div class="custom-model-select-selected">
          <div class="model-select-icon">${selIcon}</div>
          <div class="model-select-info">
            <div class="model-select-name">${selLabel}</div>
            ${selModel ? `<div class="model-select-model">${selModel}</div>` : ''}
          </div>
        </div>
        <div class="custom-model-select-arrow">▾</div>
      </div>
      <div class="custom-model-select-dropdown">
        ${optsHTML}
      </div>
    </div>
  `;
}

// 切换模型下拉框展开/收起
function toggleModelSelect(trigger) {
  const wrapper = trigger.closest('.custom-model-select');
  const wasOpen = wrapper.classList.contains('open');
  // 先关闭所有
  document.querySelectorAll('.custom-model-select.open').forEach(el => el.classList.remove('open'));
  if (!wasOpen) wrapper.classList.add('open');
}

function readVendorFromModal(vendor) {
  const card = document.querySelector(`.apikey-card[data-vendor="${vendor}"]`);
  if (!card) return null;
  const obj = {};
  card.querySelectorAll('.apikey-input').forEach(i => {
    const k = i.getAttribute('data-k');
    let v = i.value;
    if (k === 'temperature' || k === 'maxTokens') v = Number(v) || 0;
    obj[k] = v;
  });
  return obj;
}

function saveApiVendor(vendor, btnEl) {
  ensureApiKeyDefaults();
  const patch = readVendorFromModal(vendor);
  if (!patch) return;
  appData.workflowApiKeys[vendor] = { ...(appData.workflowApiKeys[vendor] || {}), ...patch };
  saveData();
  if (btnEl) { const t = btnEl.textContent; btnEl.textContent = '✅ 已保存'; setTimeout(() => btnEl.textContent = t, 1200); }
  toast('密钥已本地加密保存', 'success');
}

function testApiVendor(vendor, btnEl) {
  saveApiVendor(vendor, null); // 先保存再测
  const cfg = appData.workflowApiKeys[vendor] || {};
  if (!cfg.key) { toast('请先填入 API Key', 'warning'); return; }
  if (!cfg.baseUrl) { toast('请先填入 Base URL', 'warning'); return; }
  const oldText = btnEl ? btnEl.textContent : '';
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '测试中…'; }
  // 简单 ping（不消耗额度：请求 /models 或短 chat）
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const body = JSON.stringify({
    model: cfg.model || 'gpt-4o-mini',
    messages: [{ role: 'user', content: 'hi' }],
    max_tokens: 3,
    temperature: 0,
  });
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key };
  fetch(url, { method: 'POST', headers, body }).then(r => r.json()).then(j => {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = oldText; }
    if (j && j.choices && j.choices.length) {
      appData.workflowApiKeys[vendor].ok = true;
      saveData();
      toast(`✅ ${vendor} 连通性测试通过`, 'success');
      refreshModelConfigPanel(); // 刷新内联面板状态
    } else {
      appData.workflowApiKeys[vendor].ok = false;
      saveData();
      toast('❌ 测试失败：' + (j && j.error ? j.error.message : '接口无响应'), 'error');
    }
  }).catch(e => {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = oldText; }
    appData.workflowApiKeys[vendor].ok = false;
    saveData();
    toast('❌ 请求异常：' + (e.message || '网络错误'), 'error');
  });
}

function addExecHistory(entry) {
  if (!appData.workflowExecHistory) appData.workflowExecHistory = [];
  appData.workflowExecHistory.push(entry);
  // 最多保留 200 条
  if (appData.workflowExecHistory.length > 200) appData.workflowExecHistory.splice(0, appData.workflowExecHistory.length - 200);
  saveData();
}

function findHistory(id) { return (appData.workflowExecHistory || []).find(h => h.id === id); }

function downloadHistoryTxt(id) {
  const h = findHistory(id); if (!h) return;
  const content = `工作流：${h.name}\n时间：${new Date(h.at).toLocaleString()}\n状态：${h.status}\n耗时：${(h.duration/1000).toFixed(1)}s\n\n====== 结果 ======\n${h.summary || ''}\n`;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `exec_${h.id}.txt`;
  a.click();
  URL.revokeObjectURL(blob);
}

function downloadHistoryJson(id) {
  const h = findHistory(id); if (!h) return;
  const blob = new Blob([JSON.stringify(h, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `exec_${h.id}.json`;
  a.click();
  URL.revokeObjectURL(blob);
}

function copyHistorySummary(id) {
  const h = findHistory(id); if (!h) return;
  copyText(h.summary || '');
}

function delHistory(id) {
  if (!confirm('确定删除该执行记录？')) return;
  appData.workflowExecHistory = (appData.workflowExecHistory || []).filter(h => h.id !== id);
  saveData();
  openWorkflowHistory();
}

function clearAllHistory() {
  if (!confirm('确定清空全部执行记录？不可恢复！')) return;
  appData.workflowExecHistory = [];
  saveData();
  openWorkflowHistory();
}

function backToNodeList() {
  appData.currentNodeWf = null;
  saveData();
  renderWorkflow();
}

function deleteNodeWf(id) {
  if (!confirm('确定删除该节点工作流？')) return;
  appData.nodeWorkflows = (appData.nodeWorkflows || []).filter(w => w.id !== id);
  if (appData.currentNodeWf === id) appData.currentNodeWf = null;
  saveData();
  toast('已删除', 'success');
  renderWorkflow();
}

function exportNodeWf(id) {
  const wf = appData.nodeWorkflows.find(w => w.id === id);
  if (!wf) return;
  const data = JSON.parse(JSON.stringify(wf));
  data.format = 'nanzao_comfyui_workflow_v1';
  data.exportAt = Date.now();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${wf.name || 'workflow'}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(blob);
  toast('已导出 ComfyUI 兼容 JSON', 'success');
}

function clearNodeWfCanvas() {
  if (!confirm('确定清空当前画布所有节点和连线？')) return;
  const wf = appData.nodeWorkflows.find(w => w.id === appData.currentNodeWf);
  if (!wf) return;
  wf.nodes = []; wf.connections = []; wf.viewport = { x: 0, y: 0, zoom: 1 };
  saveData();
  renderWorkflow();
  toast('画布已清空', 'success');
}

function loadBuiltinTpl(id) {
  const tpl = BUILTIN_TEMPLATES.find(t => t.id === id);
  if (!tpl) return;
  const nw = {
    id: 'nw_' + uid(),
    name: '[模板] ' + tpl.name,
    desc: tpl.desc,
    nodes: JSON.parse(JSON.stringify(tpl.nodes)),
    connections: JSON.parse(JSON.stringify(tpl.connections)),
    viewport: { x: 0, y: 0, zoom: 0.9 },
    createdAt: Date.now(),
  };
  // 重写节点id避免冲突
  const idMap = {};
  nw.nodes.forEach(n => { const old = n.id; n.id = 'n_' + uid(); idMap[old] = n.id; });
  nw.connections.forEach(c => { c.from = idMap[c.from] || c.from; c.to = idMap[c.to] || c.to; c.from = idMap[c.from]; c.to = idMap[c.to]; });
  appData.nodeWorkflows.push(nw);
  appData.currentNodeWf = nw.id;
  appData.wfCurrentView = 'comfyui';
  saveData();
  toast('模板已加载到新工作流', 'success');
  renderWorkflow();
}

function saveAsCustomTemplate() {
  const wf = appData.nodeWorkflows.find(w => w.id === appData.currentNodeWf);
  if (!wf) return;
  const name = prompt('保存为自定义模板，请输入模板名称：', wf.name);
  if (!name) return;
  if (!appData.workflowTemplates) appData.workflowTemplates = [];
  const tpl = {
    id: 'ct_' + uid(), builtin: false, type: 'node', tagCls: '',
    name, desc: wf.desc || '',
    nodes: JSON.parse(JSON.stringify(wf.nodes)),
    connections: JSON.parse(JSON.stringify(wf.connections)),
    createdAt: Date.now(),
  };
  appData.workflowTemplates.push(tpl);
  saveData();
  toast('已保存为自定义模板', 'success');
  if (_nc) renderTemplatePanel();
}

// ========== 6. 节点画布：初始化 / 平移 / 缩放 / 渲染 ==========
function initNodeCanvasRuntime(wf) {
  const wrap = $('comfyuiWrap');
  if (!wrap) return;
  if (!wf.viewport) wf.viewport = { x: 0, y: 0, zoom: 1 };
  _nc = {
    wf,
    wrap,
    svg: $('comfyuiSvg'),
    nodesLayer: $('comfyuiNodesLayer'),
    bg: $('comfyuiBg'),
    minimap: $('comfyuiMinimap'),
    selectedIds: new Set(),
    tempWire: null, // { fromNodeId, fromPort, x, y }
    dragNode: null,
    pan: { active: false, startX: 0, startY: 0, origX: 0, origY: 0 },
    boxSel: null,
    pinch: null,
    wireSelected: null,
  };

  // 事件绑定
  bindCanvasEvents();
  renderNodePalette();
  renderTemplatePanel();
  refreshNodeCountInfo();
  renderAllNodes();
  renderAllWires();
  applyViewportStyle();

  // 自动居中第一个节点
  const any = wf.nodes && wf.nodes[0];
  if (any && (!wf.viewport.x && !wf.viewport.y && wf.viewport.zoom === 1)) {
    const r = wrap.getBoundingClientRect();
    wf.viewport.x = r.width / 2 - any.x - 110;
    wf.viewport.y = r.height / 2 - any.y - 60;
    applyViewportStyle();
  }
}

function refreshNodeCountInfo() {
  const el = $('wfNodeCountInfo');
  if (!el || !_nc) return;
  el.textContent = `${_nc.wf.nodes.length} 节点 · ${_nc.wf.connections.length} 连线 · 缩放 ${(_nc.wf.viewport.zoom*100).toFixed(0)}%`;
}

function screenToCanvas(sx, sy) {
  const r = _nc.wrap.getBoundingClientRect();
  const x = sx - r.left;
  const y = sy - r.top;
  const { x: vx, y: vy, zoom } = _nc.wf.viewport;
  return { x: (x - vx) / zoom, y: (y - vy) / zoom };
}

function applyViewportStyle() {
  if (!_nc) return;
  const { x, y, zoom } = _nc.wf.viewport;
  // 背景点跟随视口移动（制造视差）
  _nc.bg.style.backgroundPosition = `${x}px ${y}px`;
  _nc.bg.style.backgroundSize = `${24*zoom}px ${24*zoom}px`;
  // 节点层
  _nc.nodesLayer.style.transformOrigin = '0 0';
  _nc.nodesLayer.style.transform = `translate(${x}px, ${y}px) scale(${zoom})`;
  // SVG 层（用 viewBox 更稳妥：这里保留 transform 同步）
  _nc.svg.style.transformOrigin = '0 0';
  _nc.svg.style.transform = `translate(${x}px, ${y}px) scale(${zoom})`;
  refreshNodeCountInfo();
  renderMinimap();
}

function zoomNodeCanvas(factor, cx, cy) {
  if (!_nc) return;
  const r = _nc.wrap.getBoundingClientRect();
  if (cx == null) cx = r.width / 2;
  if (cy == null) cy = r.height / 2;
  const vp = _nc.wf.viewport;
  const zoom = Math.max(0.25, Math.min(3, vp.zoom * factor));
  const k = zoom / vp.zoom;
  vp.x = cx - (cx - vp.x) * k;
  vp.y = cy - (cy - vp.y) * k;
  vp.zoom = zoom;
  applyViewportStyle();
}

function resetNodeCanvas() {
  if (!_nc) return;
  const vp = _nc.wf.viewport; vp.x = 0; vp.y = 0; vp.zoom = 1; applyViewportStyle();
}

// ========== 7. 节点库渲染 & 拖入画布 ==========
function renderNodePalette() {
  if (!_nc) return;
  const body = $('nodePaletteBody'); if (!body) return;
  const kw = ($('nodeSearchInput') ? $('nodeSearchInput').value || '' : '').toLowerCase();
  const html = NODE_CATS.map(cat => {
    const items = Object.entries(NODE_DEFS).filter(([k, d]) => d.cat === cat.key &&
      (!kw || d.name.toLowerCase().includes(kw) || k.toLowerCase().includes(kw)));
    if (items.length === 0) return '';
    return `
      <div class="node-cat">${cat.label}</div>
      ${items.map(([k, d]) => `
        <div class="node-item" draggable="true" data-typekey="${k}"
             ondragstart="nodePaletteDragStart(event, '${k}')"
             onclick="quickCreateNode('${k}')" title="拖拽到画布创建节点">
          <div class="node-item-icon ${d.cat}">${d.icon}</div>
          <div>${d.name}</div>
        </div>
      `).join('')}
    `;
  }).join('');
  body.innerHTML = html || `<div style="padding:12px;color:var(--text-tertiary);font-size:12px;">无匹配节点</div>`;
}

function nodePaletteDragStart(ev, typeKey) {
  ev.dataTransfer.setData('application/x-node-type', typeKey);
  ev.dataTransfer.effectAllowed = 'copy';
}

function quickCreateNode(typeKey) {
  // 在画布中心创建
  if (!_nc) return;
  const r = _nc.wrap.getBoundingClientRect();
  const c = screenToCanvas(r.left + r.width/2, r.top + r.height/2);
  createNodeByType(typeKey, c.x - 110, c.y - 40);
}

function createNodeByType(typeKey, x, y) {
  const def = NODE_DEFS[typeKey]; if (!def) return null;
  const wf = _nc.wf;
  const data = {};
  (def.fields || []).forEach(f => { data[f.key] = f.default != null ? f.default : ''; });
  const n = { id: 'n_' + uid(), typeKey, x, y, data };
  wf.nodes.push(n);
  saveData();
  renderAllNodes(); renderAllWires();
  selectNode(n.id, false);
  return n;
}

  if (!node) return;
  const def = NODE_DEFS[node.typeKey];
  if (!def) return;

  const drawer = $('wfNodeParamDrawer');
  const mask = $('wfNpdMask');
  const title = $('wfNpdTitle');

  closeBottomDrawer();

  title.innerHTML = `${def.icon} ${def.name} · 参数配置`;

  // 生成参数字段表单
  const fieldsHTML = (def.fields || []).map(f => {
    const val = (node.data && node.data[f.key] != null) ? node.data[f.key] : (f.default != null ? f.default : '');
    if (f.type === 'textarea') {
      return `<div class="n-field">
        <div class="n-field-label">${f.label}</div>

      }
      return `<div class="n-field">
        <div class="n-field-label">${f.label}</div>

      ${(def.outputs||[]).map((p,i) => `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span>➡️ ${p.label}</span><span style="color:var(--text-tertiary);">输出</span></div>`).join('')}

  body.innerHTML = fieldsHTML + portsInfo;

  // 设置删除按钮

  mask.style.opacity = '1';

// ========== 9. 节点渲染 + 连线渲染 ==========
function renderAllNodes() {
  if (!_nc) return;
  const layer = _nc.nodesLayer;
  const wf = _nc.wf;
  layer.innerHTML = wf.nodes.map(n => renderNodeHTML(n)).join('');
  // 数据绑定

}

function renderNodeHTML(n) {
  const def = NODE_DEFS[n.typeKey]; if (!def) return '';
  const sel = _nc.selectedIds.has(n.id) ? 'selected' : '';
  const inputPorts = (def.inputs || []).map(p => `
    <div class="n-port-row input">
      <div class="n-port in" data-nid="${n.id}" data-portkey="${p.key}" data-io="in"></div>
      <div class="n-port-label">${p.label}</div>
    </div>`).join('');
  const outputPorts = (def.outputs || []).map(p => `
    <div class="n-port-row output">
      <div class="n-port-label">${p.label}</div>
      <div class="n-port out" data-nid="${n.id}" data-portkey="${p.key}" data-io="out"></div>
    </div>`).join('');

  const fieldsHTML = (def.fields || []).map(f => {
    const val = (n.data && n.data[f.key] != null) ? n.data[f.key] : (f.default != null ? f.default : '');
    if (f.type === 'textarea') {
      return `<div class="n-field">
        <div class="n-field-label">${f.label}</div>
        <textarea class="n-field-textarea" data-nid="${n.id}" data-fk="${f.key}" onchange="onNodeFieldChange(this)">${escapeHtml(String(val))}</textarea>
      </div>`;
    } else if (f.type === 'select') {
      // vendor选择器显示品牌SVG图标（通过data-icon属性，配合CSS实现前缀图标效果）
      let optsHTML;
      if (f.key === 'vendor' && typeof API_VENDORS !== 'undefined') {
        optsHTML = API_VENDORS.map(v => {
          const c = (appData.workflowApiKeys||{})[v.key] || {};
          const configured = c.key ? '●' : '○';
          const modelLabel = c.model || v.model || '';
          return `<option value="${v.key}" data-icon="${v.key}" ${v.key===val?'selected':''}>${configured} ${v.name}${modelLabel?' · '+modelLabel:''}</option>`;
        }).join('');
      } else {
        optsHTML = (f.options||[]).map(o => `<option ${o===val?'selected':''}>${escapeHtml(String(o))}</option>`).join('');
      }
      return `<div class="n-field n-field-vendor-select">
        <div class="n-field-label">${f.label}</div>
        <div class="n-select-with-icon">
          <div class="n-select-icon" id="n_select_icon_${n.id}">${getVendorIconSVG(val)}</div>
          <select class="n-field-select" data-nid="${n.id}" data-fk="${f.key}" onchange="onNodeFieldChange(this, true)">
            ${optsHTML}
          </select>
        </div>
      </div>`;
    } else {
      return `<div class="n-field">
        <div class="n-field-label">${f.label}</div>
        <input class="n-field-input" type="${f.type==='number'?'number':'text'}" ${f.type==='number'?'step="any"':''} value="${escapeHtml(String(val))}" data-nid="${n.id}" data-fk="${f.key}" onchange="onNodeFieldChange(this)">
      </div>`;
    }
  }).join('');

  return `
    <div class="n-flow-node ${sel}" data-nid="${n.id}" style="left:${n.x}px;top:${n.y}px;">
      <div class="n-flow-node-header ${def.cat}" data-drag="${n.id}">
        <div class="n-node-icon">${def.icon}</div>
        <div class="n-node-title">${escapeHtml(def.name)}</div>
        <button class="n-node-del" onclick="deleteNodeById('${n.id}', event)" title="删除节点">✕</button>
      </div>
      <div class="n-flow-node-body">
        ${fieldsHTML}
      </div>
      <div class="n-port-rows">
        ${inputPorts}
        ${outputPorts}
      </div>
      <div class="n-flow-node-footer">
        <span><span class="n-node-status-dot ${n._status || ''}"></span>${n._statusText || '就绪'}</span>
        <span style="opacity:0.6;">ID: ${n.id.slice(-4)}</span>
      </div>
    </div>
  `;
}

function onNodeFieldChange(el, withIcon) {
  const nid = el.getAttribute('data-nid');
  const fk = el.getAttribute('data-fk');
  const wf = _nc.wf;
  const node = wf.nodes.find(n => n.id === nid); if (!node) return;
  let v = el.value;
  if (el.type === 'number') v = Number(v) || 0;
  if (!node.data) node.data = {};
  node.data[fk] = v;
  // vendor变化时同步更新前缀图标
  if (withIcon && fk === 'vendor') {
    const iconEl = document.getElementById('n_select_icon_' + nid);
    if (iconEl) iconEl.innerHTML = getVendorIconSVG(v);
  }
  saveData();
}

function deleteNodeById(nid, ev) {
  if (ev) ev.stopPropagation();
  if (!confirm('确定删除该节点？相关连线将一并删除。')) return;
  const wf = _nc.wf;
  wf.nodes = wf.nodes.filter(n => n.id !== nid);
  wf.connections = wf.connections.filter(c => c.from !== nid && c.to !== nid);
  _nc.selectedIds.delete(nid);
  saveData();
  renderAllNodes(); renderAllWires();
}

function selectNode(nid, toggle) {
  if (toggle) {
    if (_nc.selectedIds.has(nid)) _nc.selectedIds.delete(nid); else _nc.selectedIds.add(nid);
  } else {
    _nc.selectedIds.clear();
    _nc.selectedIds.add(nid);
  }
  // 更新 class
  document.querySelectorAll('.n-flow-node').forEach(el => {
    el.classList.toggle('selected', _nc.selectedIds.has(el.getAttribute('data-nid')));
  });
}

function renderAllWires() {
  if (!_nc) return;
  const svg = _nc.svg;
  // 清理已有的 path（保留 defs）
  [...svg.querySelectorAll('.n-wire-group')].forEach(g => g.remove());
  const wf = _nc.wf;
  wf.connections.forEach(c => {
    const fromNode = wf.nodes.find(n => n.id === c.from);
    const toNode = wf.nodes.find(n => n.id === c.to);
    if (!fromNode || !toNode) return;
    const fromDef = NODE_DEFS[fromNode.typeKey];
    const toDef = NODE_DEFS[toNode.typeKey];
    if (!fromDef || !toDef) return;
    const fromPortIdx = (fromDef.outputs || []).findIndex(p => p.key === c.fromPort);
    const toPortIdx = (toDef.inputs || []).findIndex(p => p.key === c.toPort);
    if (fromPortIdx < 0 || toPortIdx < 0) return;
    const p1 = getOutPortPos(fromNode, fromPortIdx);
    const p2 = getInPortPos(toNode, toPortIdx);
    const d = bezierCurve(p1.x, p1.y, p2.x, p2.y);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'n-wire-group');
    g.setAttribute('data-cid', c.from + '|' + c.fromPort + '|' + c.to + '|' + c.toPort);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'n-wire');
    path.setAttribute('d', d);
    g.appendChild(path);
    g.style.pointerEvents = 'stroke';
    g.addEventListener('click', (e) => {
      if (confirm('删除此连线？')) {
        _nc.wf.connections = _nc.wf.connections.filter(x => !(x.from===c.from && x.fromPort===c.fromPort && x.to===c.to && x.toPort===c.toPort));
        saveData(); renderAllWires();
      }
    });
    svg.appendChild(g);
  });

  // 临时连线
  if (_nc.tempWire) {
    const t = _nc.tempWire;
    const fromNode = wf.nodes.find(n => n.id === t.fromNodeId);
    if (fromNode) {
      const def = NODE_DEFS[fromNode.typeKey];
      const idx = (def.outputs || []).findIndex(p => p.key === t.fromPort);
      const p1 = getOutPortPos(fromNode, idx);
      const r = _nc.wrap.getBoundingClientRect();
      const vp = wf.viewport;
      const cx = (t.x - r.left - vp.x) / vp.zoom;
      const cy = (t.y - r.top - vp.y) / vp.zoom;
      const d = bezierCurve(p1.x, p1.y, cx, cy);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'n-wire temp');
      path.setAttribute('d', d);
      svg.appendChild(path);
    }
  }
}

function bezierCurve(x1, y1, x2, y2) {
  const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
  return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

function getOutPortPos(node, portIdx) {
  const el = document.querySelector(`.n-flow-node[data-nid="${node.id}"] .n-port-row.output:nth-of-type(${portIdx+1}) .n-port.out`);
  if (el) {
    // 端口在输出行第 N 个，位置 = node.x + node.width - 偏移
    const nr = document.querySelector(`.n-flow-node[data-nid="${node.id}"]`).getBoundingClientRect();
    const pr = el.getBoundingClientRect();
    // 归一化到画布坐标（根据当前视口）
    const localX = pr.left + pr.width/2 - nr.left;
    const localY = pr.top + pr.height/2 - nr.top;
    // 用 getBoundingClientRect 的屏幕坐标换算更稳
    const wrapR = _nc.wrap.getBoundingClientRect();
    const vp = _nc.wf.viewport;
    return {
      x: (pr.left + pr.width/2 - wrapR.left - vp.x) / vp.zoom,
      y: (pr.top + pr.height/2 - wrapR.top - vp.y) / vp.zoom,
    };
  }
  // 兜底：按节点尺寸估算
  const def = NODE_DEFS[node.typeKey];
  const h = 120 + (def.fields || []).length * 40 + (def.inputs || []).length * 26 + (def.outputs || []).length * 26;
  const offset = ((def.fields || []).length) * 40 + 30 + portIdx * 26 + 13;
  return { x: node.x + 260, y: node.y + Math.min(h - 20, offset) };
}

function getInPortPos(node, portIdx) {
  const el = document.querySelector(`.n-flow-node[data-nid="${node.id}"] .n-port-row.input:nth-of-type(${portIdx+1}) .n-port.in`);
  if (el) {
    const pr = el.getBoundingClientRect();
    const wrapR = _nc.wrap.getBoundingClientRect();
    const vp = _nc.wf.viewport;
    return {
      x: (pr.left + pr.width/2 - wrapR.left - vp.x) / vp.zoom,
      y: (pr.top + pr.height/2 - wrapR.top - vp.y) / vp.zoom,
    };
  }
  const def = NODE_DEFS[node.typeKey];
  const fieldH = (def.fields || []).length * 40 + 30;
  const y = node.y + fieldH + portIdx * 26 + 13;
  return { x: node.x, y };
}

// ========== 10. 画布事件绑定（平移/框选/拖节点/连线/缩放/双指） ==========
function bindCanvasEvents() {
  const wrap = _nc.wrap;
  const svg = _nc.svg;

  // 拖放（从节点库拖入）
  wrap.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  wrap.addEventListener('drop', (e) => {
    const typeKey = e.dataTransfer.getData('application/x-node-type');
    if (!typeKey) return;
    e.preventDefault();
    const c = screenToCanvas(e.clientX, e.clientY);
    createNodeByType(typeKey, c.x - 110, c.y - 40);
  });

  // 指针/触摸
  wrap.addEventListener('mousedown', onCanvasPointerDown);
  wrap.addEventListener('mousemove', onCanvasPointerMove);
  window.addEventListener('mouseup', onCanvasPointerUp);

  // 触摸
  wrap.addEventListener('touchstart', onTouchStart, { passive: false });
  wrap.addEventListener('touchmove', onTouchMove, { passive: false });
  wrap.addEventListener('touchend', onTouchEnd, { passive: false });

  // 滚轮缩放
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1/1.1 : 1.1;
    zoomNodeCanvas(factor, e.clientX, e.clientY);
  }, { passive: false });

  // 键盘
  document.addEventListener('keydown', onKeyDown);
}

function onKeyDown(e) {
  if (!_nc) return;
  // 删除选中节点
  if ((e.key === 'Delete' || e.key === 'Backspace') && _nc.selectedIds.size) {
    // 避免输入框触发
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (!confirm(`删除选中的 ${_nc.selectedIds.size} 个节点？`)) return;
    const ids = [..._nc.selectedIds];
    _nc.wf.nodes = _nc.wf.nodes.filter(n => !ids.includes(n.id));
    _nc.wf.connections = _nc.wf.connections.filter(c => !ids.includes(c.from) && !ids.includes(c.to));
    _nc.selectedIds.clear();
    saveData(); renderAllNodes(); renderAllWires();
  }
  if (e.key === 'Escape') { _nc.selectedIds.clear(); renderAllNodes(); _nc.tempWire = null; renderAllWires(); }
}

function onCanvasPointerDown(e) {
  if (!_nc) return;
  // 端口？
  if (e.target.classList && e.target.classList.contains('n-port')) {
    const io = e.target.getAttribute('data-io');
    const nid = e.target.getAttribute('data-nid');
    const pk = e.target.getAttribute('data-portkey');
    if (io === 'out') {
      _nc.tempWire = { fromNodeId: nid, fromPort: pk, x: e.clientX, y: e.clientY };
      renderAllWires();
      return;
    }
  }
  // 节点头部？拖动节点
  const dragHead = e.target.closest && e.target.closest('[data-drag]');
  if (dragHead) {
    const nid = dragHead.getAttribute('data-drag');
    const node = _nc.wf.nodes.find(n => n.id === nid);
    if (node) {
      selectNode(nid, e.shiftKey);
      const rect = _nc.wrap.getBoundingClientRect();
      const c = screenToCanvas(e.clientX, e.clientY);
      _nc.dragNode = { ids: [..._nc.selectedIds], offsetX: c.x - node.x, offsetY: c.y - node.y, moved: false };
      return;
    }
  }
  // 点击节点非头部 → 选中 + 移动端打开参数面板
  const nodeEl = e.target.closest && e.target.closest('.n-flow-node');
  if (nodeEl) {
    const nid = nodeEl.getAttribute('data-nid');
    selectNode(nid, e.shiftKey);
    // 移动端：点击节点打开参数面板
    if (window.innerWidth < 768) {
      // 清除可能的画布平移状态
      _nc.pan.active = false;
      openNodeParamDrawer(nid);
    }
    return;
  }

  // 点击空白 → 平移/框选
  if (e.shiftKey) {
    // 框选
    const rect = _nc.wrap.getBoundingClientRect();
    _nc.boxSel = { startX: e.clientX - rect.left, startY: e.clientY - rect.top, curX: e.clientX - rect.left, curY: e.clientY - rect.top };
    const box = document.createElement('div');
    box.className = 'n-selection-box'; box.id = 'nodeSelBox';
    wrap.appendChild(box);
  } else {
    const rect = _nc.wrap.getBoundingClientRect();
    _nc.pan = { active: true, startX: e.clientX, startY: e.clientY, origX: _nc.wf.viewport.x, origY: _nc.wf.viewport.y };
    _nc.selectedIds.clear(); renderAllNodes();
  }
}

function onCanvasPointerMove(e) {
  if (!_nc) return;
  // 临时连线
  if (_nc.tempWire) { _nc.tempWire.x = e.clientX; _nc.tempWire.y = e.clientY; renderAllWires(); return; }
  // 拖拽节点
  if (_nc.dragNode) {
    const c = screenToCanvas(e.clientX, e.clientY);
    const ox = _nc.dragNode.offsetX, oy = _nc.dragNode.offsetY;
    _nc.dragNode.ids.forEach(nid => {
      const node = _nc.wf.nodes.find(n => n.id === nid); if (!node) return;
      if (!_nc.dragNode._offsets) _nc.dragNode._offsets = {};
      if (_nc.dragNode._offsets[nid] == null) {
        const first = _nc.wf.nodes.find(n => n.id === _nc.dragNode.ids[0]);
        _nc.dragNode._offsets[nid] = { dx: node.x - first.x, dy: node.y - first.y };
      }
    });
    // 先移动第一个节点，其他按相对偏移
    const ids = _nc.dragNode.ids;
    const first = _nc.wf.nodes.find(n => n.id === ids[0]);
    if (first) {
      const origFirstX = first.x, origFirstY = first.y;
      first.x = c.x - ox; first.y = c.y - oy;
      const dx = first.x - origFirstX, dy = first.y - origFirstY;
      ids.slice(1).forEach(nid => {
        const n = _nc.wf.nodes.find(nn => nn.id === nid); if (n) { n.x += dx; n.y += dy; }
      });
    }
    renderAllNodes(); renderAllWires();
    return;
  }
  // 框选
  if (_nc.boxSel) {
    const rect = _nc.wrap.getBoundingClientRect();
    _nc.boxSel.curX = e.clientX - rect.left; _nc.boxSel.curY = e.clientY - rect.top;
    const b = $('nodeSelBox');
    if (b) {
      const x1 = Math.min(_nc.boxSel.startX, _nc.boxSel.curX);
      const y1 = Math.min(_nc.boxSel.startY, _nc.boxSel.curY);
      const w = Math.abs(_nc.boxSel.curX - _nc.boxSel.startX);
      const h = Math.abs(_nc.boxSel.curY - _nc.boxSel.startY);
      b.style.left = x1 + 'px'; b.style.top = y1 + 'px'; b.style.width = w + 'px'; b.style.height = h + 'px';
    }
    return;
  }
  // 平移
  if (_nc.pan && _nc.pan.active) {
    const dx = e.clientX - _nc.pan.startX;
    const dy = e.clientY - _nc.pan.startY;
    _nc.wf.viewport.x = _nc.pan.origX + dx;
    _nc.wf.viewport.y = _nc.pan.origY + dy;
    applyViewportStyle();
    renderAllWires();
  }
}

function onCanvasPointerUp(e) {
  if (!_nc) return;
  // 临时连线结束 → 判断是否落在目标 in-port 上
  if (_nc.tempWire) {
    let target = null;
    if (e.target && e.target.classList && e.target.classList.contains('n-port') && e.target.getAttribute('data-io') === 'in') {
      target = { nid: e.target.getAttribute('data-nid'), pk: e.target.getAttribute('data-portkey') };
    }
    if (target) {
      const { fromNodeId, fromPort } = _nc.tempWire;
      // 避免重复和自连
      if (target.nid !== fromNodeId) {
        const exists = _nc.wf.connections.some(c => c.from===fromNodeId && c.fromPort===fromPort && c.to===target.nid && c.toPort===target.pk);
        if (!exists) {
          _nc.wf.connections.push({ from: fromNodeId, fromPort, to: target.nid, toPort: target.pk });
          saveData();
        }
      }
    }
    _nc.tempWire = null;
    renderAllWires();
    return;
  }
  if (_nc.dragNode) { _nc.dragNode = null; saveData(); }
  if (_nc.boxSel) {
    const { startX, startY, curX, curY } = _nc.boxSel;
    const x1 = Math.min(startX, curX), y1 = Math.min(startY, curY);
    const x2 = Math.max(startX, curX), y2 = Math.max(startY, curY);
    const vp = _nc.wf.viewport;
    const wrap = _nc.wrap;
    _nc.selectedIds.clear();
    _nc.wf.nodes.forEach(n => {
      // node bbox 转屏幕坐标
      const el = document.querySelector(`.n-flow-node[data-nid="${n.id}"]`);
      if (!el) return;
      const r = el.getBoundingClientRect();
      const wr = wrap.getBoundingClientRect();
      const nx1 = r.left - wr.left, ny1 = r.top - wr.top, nx2 = r.right - wr.left, ny2 = r.bottom - wr.top;
      if (nx2 >= x1 && nx1 <= x2 && ny2 >= y1 && ny1 <= y2) _nc.selectedIds.add(n.id);
    });
    renderAllNodes();
    const b = $('nodeSelBox'); if (b) b.remove();
    _nc.boxSel = null;
  }
  if (_nc.pan) { _nc.pan.active = false; saveData(); }
}

// 移动端触摸 + 双指缩放
function onTouchStart(e) {
  if (!_nc) return;
  if (e.touches.length === 2) {
    e.preventDefault();
    // 取消长按
    if (_mobileLongPressTimer) { clearTimeout(_mobileLongPressTimer); _mobileLongPressTimer = null; }
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    _nc.pinch = {
      dist,
      cx: (t1.clientX + t2.clientX) / 2,
      cy: (t1.clientY + t2.clientY) / 2,
      origZoom: _nc.wf.viewport.zoom,
      origX: _nc.wf.viewport.x,
      origY: _nc.wf.viewport.y,
    };
    return;
  }
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const targetEl = document.elementFromPoint(t.clientX, t.clientY);
    _mobileTouchStart = { x: t.clientX, y: t.clientY, time: Date.now(), target: targetEl };
    _mobileLongPressTriggered = false;

    // 端口连接（输出端口按下）
    if (targetEl && targetEl.classList.contains('n-port') && targetEl.getAttribute('data-io') === 'out') {
      const nid = targetEl.getAttribute('data-nid');
      const pk = targetEl.getAttribute('data-portkey');
      _nc.tempWire = { fromNodeId: nid, fromPort: pk, x: t.clientX, y: t.clientY };
      renderAllWires();
      return;
    }

    // 节点头部 → 直接进入拖拽（桌面端同样行为）
    const dragHead = targetEl && targetEl.closest && targetEl.closest('[data-drag]');
    if (dragHead) {
      const nid = dragHead.getAttribute('data-drag');
      const node = _nc.wf.nodes.find(n => n.id === nid);
      if (node) {
        selectNode(nid, false);
        const c = screenToCanvas(t.clientX, t.clientY);
        _nc.dragNode = { ids: [nid], offsetX: c.x - node.x, offsetY: c.y - node.y, moved: false };
        return;
      }
    }

    // 长按检测（节点区域）
    const isNodeArea = targetEl && (targetEl.closest('.n-flow-node') || targetEl.classList.contains('n-flow-node'));
    if (isNodeArea) {
      _mobileLongPressTimer = setTimeout(() => {
        if (!_mobileTouchStart) return;
        const el = _mobileTouchStart.target;
        if (!el) return;
        const nodeEl = el.closest('.n-flow-node');
        if (nodeEl) {
          _mobileLongPressTriggered = true;
          const nid = nodeEl.getAttribute('data-nid');
          const node = _nc.wf.nodes.find(n => n.id === nid);
          if (node) {
            selectNode(nid, false);
            const c = screenToCanvas(_mobileTouchStart.x, _mobileTouchStart.y);
            _nc.dragNode = { ids: [nid], offsetX: c.x - node.x, offsetY: c.y - node.y, moved: false };
          }
        }
      }, 350);
    } else {
      // 非节点区域 → 画布平移
      const fake = { clientX: t.clientX, clientY: t.clientY, target: targetEl, shiftKey: false,
        closest: (sel) => { return targetEl ? targetEl.closest(sel) : null; } };
      onCanvasPointerDown(fake);
    }
  }
}

function onTouchMove(e) {
  if (!_nc) return;
  if (_nc.pinch && e.touches.length === 2) {
    e.preventDefault();
    // 取消长按
    if (_mobileLongPressTimer) { clearTimeout(_mobileLongPressTimer); _mobileLongPressTimer = null; }
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const k = dist / _nc.pinch.dist;
    const desiredZoom = Math.max(0.25, Math.min(3, _nc.pinch.origZoom * k));
    const cx = _nc.pinch.cx, cy = _nc.pinch.cy;
    const realK = desiredZoom / _nc.pinch.origZoom;
    _nc.wf.viewport.zoom = desiredZoom;
    _nc.wf.viewport.x = cx - (cx - _nc.pinch.origX) * realK;
    _nc.wf.viewport.y = cy - (cy - _nc.pinch.origY) * realK;
    applyViewportStyle(); renderAllWires();
    return;
  }
  if (e.touches.length === 1) {
    const t = e.touches[0];
    // 检测移动幅度，超过阈值则取消长按
    if (_mobileTouchStart && _mobileLongPressTimer) {
      const dx = Math.abs(t.clientX - _mobileTouchStart.x);
      const dy = Math.abs(t.clientY - _mobileTouchStart.y);
      if (dx > 8 || dy > 8) {
        clearTimeout(_mobileLongPressTimer);
        _mobileLongPressTimer = null;
      }
    }
    const fake = { clientX: t.clientX, clientY: t.clientY };
    onCanvasPointerMove(fake);
  }
}

function onTouchEnd(e) {
  if (!_nc) return;
  // 清理长按定时器
  if (_mobileLongPressTimer) {
    clearTimeout(_mobileLongPressTimer);
    _mobileLongPressTimer = null;
  }

  if (_nc.pinch) { _nc.pinch = null; saveData(); _mobileTouchStart = null; return; }

  // 长按触发了拖拽 → 结束拖拽
  if (_mobileLongPressTriggered) {
    _mobileLongPressTriggered = false;
    _mobileTouchStart = null;
    const fake = { clientX: 0, clientY: 0, target: null };
    onCanvasPointerUp(fake);
    return;
  }

  // 端口连线：输出端口按下后，手指抬到输入端口 → 完成连接
  if (_nc.tempWire && e.changedTouches.length === 1) {
    const t = e.changedTouches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.classList.contains('n-port') && el.getAttribute('data-io') === 'in') {
      const toNid = el.getAttribute('data-nid');
      const toPk = el.getAttribute('data-portkey');
      // 检查是否已存在相同连接
      const exists = _nc.wf.connections.some(c => c.from === _nc.tempWire.fromNodeId && c.fromPort === _nc.tempWire.fromPort && c.to === toNid && c.toPort === toPk);
      if (!exists) {
        _nc.wf.connections.push({
          from: _nc.tempWire.fromNodeId,
          fromPort: _nc.tempWire.fromPort,
          to: toNid,
          toPort: toPk
        });
        saveData();
      }
      _nc.tempWire = null;
      renderAllWires();
      _mobileTouchStart = null;
      return;
    } else {
      // 没有连到输入端口 → 取消连线
      _nc.tempWire = null;
      renderAllWires();
    }
  }

  // 短按 → 模拟点击
  if (_mobileTouchStart) {
    const t = _mobileTouchStart;
    const targetEl = t.target;
    const isNodeArea = targetEl && (targetEl.closest('.n-flow-node') || targetEl.classList.contains('n-flow-node'));
    const isDragArea = targetEl && targetEl.closest('[data-drag]');

    if (isNodeArea && !isDragArea) {
      // 点击节点非头部 → 移动端打开参数面板
      const nodeEl = targetEl.closest('.n-flow-node');
      if (nodeEl) {
        const nid = nodeEl.getAttribute('data-nid');
        selectNode(nid, false);
        if (window.innerWidth < 768) {
          openNodeParamDrawer(nid);
        }
      }
    } else {
      // 其余按原有逻辑处理
      const fake = { clientX: 0, clientY: 0, target: null };
      onCanvasPointerUp(fake);
    }
  } else {
    const fake = { clientX: 0, clientY: 0, target: null };
    onCanvasPointerUp(fake);
  }
  _mobileTouchStart = null;
}

// ========== 12. 小地图 ==========
function renderMinimap() {
  if (!_nc || !_nc.minimap) return;
  const wf = _nc.wf;
  const mw = 180, mh = 120;
  // 计算节点 bbox
  if (!wf.nodes.length) { _nc.minimap.innerHTML = ''; return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  wf.nodes.forEach(n => {
    const def = NODE_DEFS[n.typeKey];
    if (!def) return;
    const w = 260, h = 120 + (def.fields || []).length * 40 + (def.inputs || []).length * 26 + (def.outputs || []).length * 26;
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
  });
  const pad = 80;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const worldW = maxX - minX, worldH = maxY - minY;
  const scale = Math.min(mw / worldW, mh / worldH);
  const vp = wf.viewport;
  const wrapR = _nc.wrap.getBoundingClientRect();
  // 视口矩形（画布坐标）
  const viewW = wrapR.width / vp.zoom, viewH = wrapR.height / vp.zoom;
  const viewX = - vp.x / vp.zoom, viewY = - vp.y / vp.zoom;
  const html = `
    <svg width="${mw}" height="${mh}" style="display:block;">
      <rect width="${mw}" height="${mh}" fill="#0a0a0a"/>
      ${wf.nodes.map(n => {
        const def = NODE_DEFS[n.typeKey]; if (!def) return '';
        const x = (n.x - minX) * scale;
        const y = (n.y - minY) * scale;
        const w = 260 * scale, h = 80 * scale;
        return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(34,197,94,0.5)" rx="2"/>`;
      }).join('')}
      <rect x="${(viewX - minX)*scale}" y="${(viewY - minY)*scale}" width="${viewW*scale}" height="${viewH*scale}" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    </svg>
  `;
  _nc.minimap.innerHTML = html;
}

// ========== 13. 节点工作流执行（前端模拟器 + 调用真实API） ==========
let _nodeWfRunning = false, _nodeWfStop = false;

function runNodeWf() {
  if (!_nc) return;
  const wf = _nc.wf;
  if (!wf.nodes.length) { toast('画布为空，请先添加节点', 'warning'); return; }
  if (_nodeWfRunning) { toast('已在执行中', 'warning'); return; }
  _nodeWfRunning = true; _nodeWfStop = false;
  const t0 = Date.now();
  setWfStatus('running');
  appendNodeLog('info', `▶ 开始执行节点工作流：${wf.name}。节点数=${wf.nodes.length}，连线数=${wf.connections.length}`);

  // 拓扑排序
  const order = topoSort(wf);
  if (!order) {
    appendNodeLog('error', '❌ 节点图中存在循环依赖，无法执行。请检查连线。');
    setWfStatus('error');
    _nodeWfRunning = false;
    return;
  }
  appendNodeLog('info', `执行顺序：${order.map(id => { const n = wf.nodes.find(x=>x.id===id); return n ? NODE_DEFS[n.typeKey].name : '?'; }).join(' → ')}`);

  const outputs = {}; // nodeId -> { portKey -> value }

  (async () => {
    for (let i = 0; i < order.length; i++) {
      if (_nodeWfStop) { appendNodeLog('warn', '⏹ 已手动停止执行'); break; }
      const nid = order[i];
      const node = wf.nodes.find(n => n.id === nid);
      if (!node) continue;
      node._status = 'running'; node._statusText = '执行中'; renderNodeStatus(node);
      try {
        const stepStart = Date.now();
        const result = await execNode(node, outputs);
        outputs[nid] = result || {};
        node._status = 'done'; node._statusText = `完成（${(Date.now()-stepStart)}ms）`;
        renderNodeStatus(node);
        appendNodeLog('success', `✅ [${NODE_DEFS[node.typeKey].name}] 执行完成`);
      } catch (err) {
        node._status = 'error'; node._statusText = '错误：' + (err.message || '').slice(0, 28);
        renderNodeStatus(node);
        appendNodeLog('error', `❌ [${NODE_DEFS[node.typeKey].name}] ${err.message || err}`);
      }
      await new Promise(r => setTimeout(r, 120));
    }
    const dur = Date.now() - t0;
    const status = _nodeWfStop ? 'idle' : (wf.nodes.some(n => n._status === 'error') ? 'error' : 'done');
    setWfStatus(status);
    appendNodeLog(status === 'error' ? 'error' : (status === 'done' ? 'success' : 'info'),
      status === 'done' ? `🎉 工作流执行完成！共耗时 ${(dur/1000).toFixed(2)} 秒` :
      status === 'error' ? `⚠️ 部分节点执行失败，总耗时 ${(dur/1000).toFixed(2)} 秒` :
      `⏹ 执行已中止，总耗时 ${(dur/1000).toFixed(2)} 秒`);

    // 写历史
    const summaryArr = [];
    wf.nodes.forEach(n => {
      const def = NODE_DEFS[n.typeKey];
      summaryArr.push(`【${def.icon}${def.name}】状态：${n._status === 'done' ? '✅成功' : n._status === 'error' ? '❌失败' : '⏭未执行'}`);
      if (n._lastOutputPreview) summaryArr.push(n._lastOutputPreview);
    });
    addExecHistory({
      id: 'h_' + uid(), type: 'node', name: wf.name, status,
      at: t0, duration: dur, summary: summaryArr.join('\n----\n'),
      exportTxt: true, exportJson: true, data: JSON.parse(JSON.stringify({ nodes: wf.nodes, connections: wf.connections }))
    });
    _nodeWfRunning = false;
  })();
}

function stopNodeWf() { if (_nodeWfRunning) _nodeWfStop = true; else toast('当前未在执行', 'info'); }

function setWfStatus(s) {
  const el = $('wfStatusPill');
  if (!el) return;
  el.className = 'wf-log-status-pill ' + s;
  el.textContent = s === 'done' ? '✅ 完成' : s === 'running' ? '⏵ 执行中' : s === 'error' ? '❌ 失败' : '🕒 空闲';
}

function appendNodeLog(level, text) {
  const el = $('wfNodeLogArea'); if (!el) return;
  const t = new Date();
  const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
  const line = document.createElement('div');
  line.className = 'wf-log-line';
  line.innerHTML = `<span class="wf-log-time">[${ts}]</span> <span class="wf-log-${level}">${escapeHtml(text)}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function renderNodeStatus(node) {
  const el = document.querySelector(`.n-flow-node[data-nid="${node.id}"]`);
  if (!el) return;
  const dot = el.querySelector('.n-node-status-dot');
  if (dot) { dot.className = 'n-node-status-dot ' + (node._status || ''); }
  const foot = el.querySelector('.n-flow-node-footer span:first-child');
  if (foot) foot.innerHTML = `<span class="n-node-status-dot ${node._status || ''}"></span>${node._statusText || '就绪'}`;
}

function topoSort(wf) {
  const idSet = new Set(wf.nodes.map(n => n.id));
  const indeg = {}; wf.nodes.forEach(n => indeg[n.id] = 0);
  wf.connections.forEach(c => { if (idSet.has(c.from) && idSet.has(c.to)) indeg[c.to] = (indeg[c.to] || 0) + 1; });
  const q = []; Object.keys(indeg).forEach(k => { if (indeg[k] === 0) q.push(k); });
  const order = [];
  while (q.length) {
    const u = q.shift(); order.push(u);
    wf.connections.filter(c => c.from === u).forEach(c => { indeg[c.to]--; if (indeg[c.to] === 0) q.push(c.to); });
  }
  return order.length === wf.nodes.length ? order : null;
}

// 解析 {port:xxx} 这类引用变量
function interpolate(template, node, outputs, wf) {
  if (typeof template !== 'string') return template;
  // 输入 port 映射：遍历该 node 的输入连线，找 fromPort=? → inputKey=?
  const inMap = {};
  wf.connections.filter(c => c.to === node.id).forEach(c => { inMap[c.toPort] = { from: c.from, fromPort: c.fromPort }; });
  let str = template;
  // {input:prompt} 形式 → 从输入连接取
  str = str.replace(/\{input:([^}]+)\}/g, (_, k) => {
    const m = inMap[k]; if (!m) return '';
    return String((outputs[m.from] || {})[m.fromPort] || '');
  });
  // {prompt} / {text} / 输入 key 同名
  const def = NODE_DEFS[node.typeKey];
  (def.inputs || []).forEach(inp => {
    const m = inMap[inp.key];
    if (m) {
      const v = String((outputs[m.from] || {})[m.fromPort] || '');
      str = str.split('{' + inp.key + '}').join(v);
    }
  });
  return str;
}

async function execNode(node, outputs) {
  const wf = _nc.wf;
  const def = NODE_DEFS[node.typeKey];
  const d = node.data || {};
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  node._lastOutputPreview = null;

  // ---- 📝 文本类 ----
  switch (node.typeKey) {
    case 'text_input':
      return { text: interpolate(d.text || '', node, outputs, wf) };

    case 'llm_generate': {
      ensureApiKeyDefaults();
      const vendor = d.vendor || 'deepseek';
      const cfg = appData.workflowApiKeys[vendor] || {};
      const prompt = interpolate(d.prompt || '', node, outputs, wf);
      const systemPrompt = interpolate(d.systemPrompt || '', node, outputs, wf);
      appendNodeLog('info', `调用厂商 ${vendor} · prompt=${prompt.slice(0,40)}...`);
      if (!cfg.key) {
        appendNodeLog('warn', '未配置该厂商密钥，进入「模拟执行」模式，输出示例内容。');
        await sleep(500);
        const demo = `【模拟输出 · ${vendor}未配置】\n这是关于"${prompt.slice(0,20)}"的第1条文案：专业生动、引人入胜。\n这是第2条文案：突出卖点，直击痛点。\n这是第3条文案：场景化表达，引发共鸣。`;
        node._lastOutputPreview = demo.slice(0, 200);
        return { text: demo };
      }
      try {
        const url = (cfg.baseUrl || 'https://api.deepseek.com/v1').replace(/\/$/, '') + '/chat/completions';
        const body = JSON.stringify({
          model: cfg.model || 'deepseek-chat',
          messages: [
            { role: 'system', content: systemPrompt || '你是助手。' },
            { role: 'user', content: prompt },
          ],
          temperature: Number(d.temperature) || cfg.temperature || 0.7,
          max_tokens: Number(d.maxTokens) || cfg.maxTokens || 2048,
        });
        const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key };
        const r = await fetch(url, { method: 'POST', headers, body });
        const j = await r.json();
        if (j && j.choices && j.choices[0]) {
          const txt = j.choices[0].message && j.choices[0].message.content;
          node._lastOutputPreview = String(txt || '').slice(0, 200);
          return { text: txt || '' };
        }
        throw new Error((j && j.error && j.error.message) || '接口返回异常');
      } catch (e) {
        appendNodeLog('error', '调用失败：' + e.message);
        throw e;
      }
    }

    case 'text_export': {
      let content = '';
      // 取输入
      const conn = wf.connections.find(c => c.to === node.id);
      if (conn) {
        const prev = (outputs[conn.from] || {})[conn.fromPort] || '';
        content = String(prev);
      }
      const filename = (d.filename || 'workflow_output') + '.' + (d.format || 'txt');
      const data = d.format === 'json' ? JSON.stringify({ content }, null, 2) : content;
      const blob = new Blob([data], { type: d.format === 'json' ? 'application/json' : 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(blob);
      node._lastOutputPreview = `已导出文件：${filename}`;
      return {};
    }

    // ---- 🖼 图像类 ----
    case 'img_prompt': {
      let pos = interpolate(d.positive || '', node, outputs, wf);
      let neg = interpolate(d.negative || '', node, outputs, wf);
      const style = d.style || '无';
      const styleBoosts = {
        '电商主图': ', e-commerce product photography, studio softbox lighting, pure background, ultra sharp, 8k hdr',
        '商品场景图': ', lifestyle scene, natural sunlight, elegant environment, commercial photography',
        '国风三渲二': ', guofeng chinese style, 3D-to-2D cel-shaded render, soft outline, xianxia mood',
        '赛博朋克': ', cyberpunk, neon lights, rainy street, sci-fi, cinematic lighting',
        '日漫': ', anime style, studio ghibli inspired, pastel color palette, soft shading',
        '写实摄影': ', photorealistic, canon eos r5, 85mm f1.4, shallow depth of field',
        '概念艺术': ', concept art, trending on artstation, cinematic composition, dramatic lighting',
      };
      if (styleBoosts[style]) pos += styleBoosts[style];
      appendNodeLog('info', `风格预设：${style} · 正向词 ${pos.length} 字 · 反向词 ${neg.length} 字`);
      return { positive: pos, negative: neg };
    }

    case 'img_text2img':
    case 'img_img2img': {
      appendNodeLog('warn', '⚠️ 文/图生图需要 SD/ComfyUI/Midjourney 后端生成，当前在「模拟执行」：生成占位预览图。');
      await sleep(600);
      // 用 canvas 生成占位图
      const canvas = document.createElement('canvas');
      const ratio = d.ratio || '1:1';
      const sizeMap = { '1:1': [512,512], '3:4': [384,512], '4:3': [512,384], '9:16': [288,512], '16:9': [512,288] };
      const [W, H] = sizeMap[ratio] || [512,512];
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const g = ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0, '#0f2027'); g.addColorStop(0.5, '#203a43'); g.addColorStop(1, '#2c5364');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = `bold ${Math.floor(W/18)}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('生成图占位', W/2, H/2 - 10);
      ctx.font = `${Math.floor(W/30)}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(`${ratio} · ${W}x${H}`, W/2, H/2 + 20);
      ctx.fillText(new Date().toLocaleString(), W/2, H/2 + 48);
      const dataUrl = canvas.toDataURL('image/png');
      node._lastOutputPreview = `[生成图像 ${W}x${H} · 占位预览]`;
      return { image: dataUrl };
    }

    case 'img_controlnet': {
      const conn = wf.connections.find(c => c.to === node.id);
      const refImg = conn ? (outputs[conn.from] || {})[conn.fromPort] : '';
      appendNodeLog('info', `ControlNet 类型=${d.type||'Canny'}，权重=${d.weight||0.8}`);
      return {
        cn_out: `[ControlNet ${d.type||'IPAdapter'} 锁定形态] 权重=${d.weight||0.8}`,
        positive: refImg ? '<使用参考图正向特征>' : '',
      };
    }

    case 'img_preprocess': {
      const conn = wf.connections.find(c => c.to === node.id);
      const img = conn ? (outputs[conn.from] || {})[conn.fromPort] : '';
      appendNodeLog('info', `预处理动作：${d.action||'AI自动抠图'}`);
      node._lastOutputPreview = `已完成预处理：${d.action||'AI自动抠图'}（实际抠图需后端算法）`;
      return { image: img || '[预处理后图像]' };
    }

    case 'img_preview': {
      const conn = wf.connections.find(c => c.to === node.id);
      const img = conn ? (outputs[conn.from] || {})[conn.fromPort] : '';
      if (typeof img === 'string' && img.startsWith('data:image')) {
        const a = document.createElement('a');
        a.href = img; a.download = (d.filename || 'image') + '.png'; a.click();
        appendNodeLog('success', '📥 已触发图片下载');
      } else {
        appendNodeLog('warn', '无图像数据可下载（可能未生成或仅为文本引用）');
      }
      return {};
    }

    // ---- 🎬 视频/多媒体 ----
    case 'v_txt2vid':
    case 'v_img2vid': {
      appendNodeLog('warn', '⚠️ 视频生成需要 Runway/Pika/Sora 等后端；当前以「模拟执行」输出描述文件。');
      await sleep(800);
      const txt = `【模拟视频输出 · ${d.duration||4}秒】\n提示词：${interpolate(d.prompt||'', node, outputs, wf).slice(0,100)}\n运镜：${d.camera||'柔和'} · 运动幅度：${d.motion||'中'}`;
      node._lastOutputPreview = txt;
      return { video: txt };
    }

    case 'v_tts': {
      const text = interpolate(node.data.text || '', node, outputs, wf);
      appendNodeLog('info', `TTS · 发音人=${d.voice||'磁性男声'} · 语速=${d.speed||1} · 文本长度=${text.length}`);
      appendNodeLog('warn', 'TTS需调用对应厂商（阿里/腾讯/微软）API，当前为模拟执行，输出描述文本。');
      await sleep(300);
      return { audio: `[TTS 音频] 发音人=${d.voice||'磁性男声'}：${text.slice(0,80)}${text.length>80?'…':''}` };
    }

    case 'v_bgm': {
      appendNodeLog('info', `BGM · 风格=${d.style||'轻商务'} · 时长=${d.duration||30}s · 音量=${d.volume||0.5}`);
      return { audio: `[BGM ${d.style||'轻商务'}] ${d.duration||30}s 音量${d.volume||0.5}` };
    }

    case 'v_compose': {
      appendNodeLog('warn', '⚠️ 完整视频拼接成片（多片段+配音+BGM+字幕）建议导出 ComfyUI JSON 在本地 ComfyUI/FFmpeg 执行。当前输出「合成描述」。');
      await sleep(500);
      node._lastOutputPreview = `合成参数：${d.resolution||''} / 转场=${d.transition||'淡入淡出'} / 字幕=${d.subtitles||'自动'}`;
      return { video: `[成片描述] ${d.resolution||''} · 转场=${d.transition||'淡入淡出'} · 字幕=${d.subtitles||'自动'} · 已合成 ${(new Date()).toLocaleTimeString()}` };
    }

    case 'v_export': {
      const mode = d.exportMode || 'json';
      const filename = d.filename || 'nanzao_workflow';
      const toExport = {
        format: 'ComfyUI_workflow_api_v1',
        generatedBy: 'nanzao-workbench',
        exportedAt: Date.now(),
        name: wf.name,
        nodes: wf.nodes.map(n => ({
          id: n.id, type: n.typeKey,
          def: NODE_DEFS[n.typeKey] ? { name: NODE_DEFS[n.typeKey].name, icon: NODE_DEFS[n.typeKey].icon } : null,
          pos: [n.x, n.y], data: n.data
        })),
        connections: wf.connections,
      };
      if (mode === '在浏览器中预览下载' || mode.includes('预览')) {
        const conn = wf.connections.find(c => c.to === node.id);
        const v = conn ? (outputs[conn.from] || {})[conn.fromPort] : '';
        if (typeof v === 'string') {
          const blob = new Blob([v], { type: 'text/plain' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename + '.txt'; a.click();
          appendNodeLog('success', `📥 已下载：${filename}.txt`);
        } else {
          appendNodeLog('warn', '无可预览的内容；请改用 JSON 导出。');
        }
      } else {
        const blob = new Blob([JSON.stringify(toExport, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename + '.json'; a.click();
        appendNodeLog('success', `📥 已导出 ComfyUI 兼容 JSON：${filename}.json`);
      }
      return {};
    }

    // ---- 🔧 工具 ----
    case 'util_delay':
      await sleep((d.seconds || 2) * 1000);
      return { next: true };

    case 'util_note':
      return {};
  }

  return {};
}

// ========== 14. Supabase 登录后云端同步（可选，不影响未登录用户localStorage） ==========
// 约定：登录后触发 syncWfToCloud()，失败静默，只打日志，不阻塞用户
async function syncWfToCloud() {
  if (!sbClient || !currentUserId) return;
  try {
    const payload = {
      workflows: appData.workflows || [],
      nodeWorkflows: appData.nodeWorkflows || [],
      workflowTemplates: appData.workflowTemplates || [],
      workflowExecHistory: (appData.workflowExecHistory || []).slice(-50),
      updatedAt: Date.now(),
    };
    // 简单写一张 profiles / wf_data 表（如果存在），失败不计入错误
    await sbClient.from('profiles').upsert({
      id: currentUserId,
      wf_data: payload,
    });
  } catch (e) { console.warn('[syncWfToCloud] skipped', e && e.message); }
}

// 原 saveData 包装一下：如果已登录，则异步同步
(function patchSaveDataForCloud() {
  const origSave = saveData;
  window.saveData = function() {
    origSave.apply(this, arguments);
    if (authReady && currentUserId) {
      clearTimeout(window._wfSyncT);
      window._wfSyncT = setTimeout(syncWfToCloud, 1200);
    }
  };
})();


init();
</script>
