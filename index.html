<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南崽工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg-primary: #0a0a0a;
    --bg-secondary: #0f0f0f;
    --bg-nav: #0d0d0d;
    --bg-card: rgba(255, 255, 255, 0.03);
    --bg-card-hover: rgba(255, 255, 255, 0.06);
    --bg-elevated: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.05);
    --border-light: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent: #22c55e;
    --accent-2: #4ade80;
    --accent-hover: #4ade80;
    --accent-glow: rgba(34, 197, 94, 0.3);
    --accent-2-glow: rgba(74, 222, 128, 0.2);
    --text-primary: #f0f0f0;
    --text-secondary: rgba(255, 255, 255, 0.5);
    --text-tertiary: rgba(255, 255, 255, 0.3);
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: var(--text-primary);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 197, 94, 0.12), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(34, 197, 94, 0.06), transparent),
      radial-gradient(ellipse 50% 40% at 0% 80%, rgba(74, 222, 128, 0.04), transparent),
      #0a0a0a;
    background-attachment: fixed;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
    opacity: 0.7;
    z-index: 9999;
    pointer-events: none;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  .app-container {
    display: flex; flex-direction: column; height: 100vh;
    position: relative; z-index: 1;
  }
  .top-bar {
    height: 58px; flex-shrink: 0;
    background: rgba(8, 8, 12, 0.6);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 1px solid var(--glass-border);
    display: flex; align-items: center; padding: 0 18px; gap: 12px;
    z-index: 100;
  }
  .main-body { flex: 1; display: flex; overflow: hidden; }

  /* 左侧导航 */
  .sidebar {
    width: 232px; flex-shrink: 0;
    background: rgba(8, 8, 12, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
    overflow-y: auto;
    display: flex; flex-direction: column;
    padding-bottom: 12px;
  }
  .sidebar-logo {
    padding: 20px 18px 16px; font-weight: 700; font-size: 17px;
    border-bottom: 1px solid var(--glass-border);
    color: var(--text-primary);
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }
  .sidebar-logo span:first-child {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; margin: 2px 10px; cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 10px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .nav-item:hover {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-primary);
  }
  .nav-item.active {
    background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(34,197,94,0.05));
    color: var(--accent);
    font-weight: 600;
    border-color: rgba(34,197,94,0.2);
    box-shadow: 0 0 20px rgba(34,197,94,0.08);
  }
  .nav-section {
    padding: 14px 20px 6px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text-tertiary);
    font-weight: 600;
  }

  /* 中间内容区 */
  .content-area {
    flex: 1; overflow-y: auto;
    padding: 24px;
    background: transparent;
  }
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .page-title {
    font-size: 23px; font-weight: 700;
    letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 10px;
  }
  .page-actions { display: flex; gap: 8px; }

  /* 玻璃泡泡卡片 */
  .card {
    background: rgba(255, 255, 255, 0.035);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.06) inset,
      0 8px 32px rgba(0, 0, 0, 0.25);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 50%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .card:hover {
    border-color: rgba(255, 255, 255, 0.18);
    transform: translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.08) inset,
      0 12px 40px rgba(0, 0, 0, 0.35),
      0 0 0 1px rgba(34, 197, 94, 0.1);
    background: rgba(255, 255, 255, 0.055);
  }
  .card-title {
    font-size: 15px; font-weight: 600;
    margin-bottom: 14px;
    letter-spacing: -0.1px;
  }

  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  /* 按钮 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border-radius: 10px;
    font-size: 13px; cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    background: transparent; color: var(--text-primary);
    font-weight: 500;
    letter-spacing: 0.1px;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #16a34a);
    color: white; border: none;
    box-shadow: 0 2px 10px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, var(--accent-hover), var(--accent));
    box-shadow: 0 4px 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-color: var(--glass-border);
    color: var(--text-primary);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.18);
  }
  .btn-danger {
    background: transparent;
    border-color: rgba(239,68,68,0.35);
    color: #fca5a5;
  }
  .btn-danger:hover { background: rgba(239,68,68,0.08); border-color: var(--danger); color: #fca5a5; }
  .btn-success {
    background: transparent;
    border-color: rgba(16,185,129,0.35);
    color: #6ee7b7;
  }
  .btn-success:hover { background: rgba(16,185,129,0.08); border-color: var(--success); color: #6ee7b7; }
  .btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 8px; }
  .btn-text { margin-left: 5px; }

  /* ===== 3D 流体粒子卡片效果 ===== */
  .particle-card {
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
    will-change: transform;
  }
  .particle-card canvas.particle-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
    pointer-events: none;
    z-index: 0;
    border-radius: inherit;
  }
  .particle-card > *:not(canvas):not(.card-shine):not(.card-glow) {
    position: relative;
    z-index: 1;
  }
  .particle-card .card-shine {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.12) 0%, transparent 50%);
    pointer-events: none;
    z-index: 2;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .particle-card:hover .card-shine,
  .particle-card.touching .card-shine {
    opacity: 1;
  }
  .particle-card .card-glow {
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(34,197,94,0.2), transparent 50%, rgba(59,130,246,0.15));
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: -1;
    filter: blur(8px);
  }
  .particle-card:hover .card-glow,
  .particle-card.touching .card-glow {
    opacity: 1;
  }

  /* Stat Cards Row */
  .stat-cards-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .stat-card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  }
  .stat-card:hover {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.12);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .stat-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .stat-label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .stat-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .stat-number {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.1;
    color: var(--text-primary);
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 2px;
  }
  .stat-trend {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 12px;
    font-weight: 500;
  }
  .stat-trend.up span { color: #22c55e; }
  .stat-trend.down span { color: #ef4444; }

  /* 3D Stack Cards */
  .stack-3d-container {
    position: relative;
    min-height: 160px;
    perspective: 1000px;
  }
  .stack-3d-card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    margin-bottom: -8px;
    position: relative;
  }
  .stack-3d-card:hover {
    transform: translateX(0) scale(1) !important;
    z-index: 10 !important;
    border-color: rgba(34,197,94,0.3);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(34,197,94,0.08);
  }
  .stack-3d-card.stack-selected {
    border-color: rgba(34,197,94,0.4);
    box-shadow: 0 0 24px rgba(34,197,94,0.12);
  }
  .stack-card-inner {
    padding: 16px 18px 18px;
  }

  /* Smart Detail Panel */
  .smart-detail-panel {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
  }
  .smart-detail-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .smart-detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .smart-detail-row:last-child { border-bottom: none; }
  .smart-detail-label { color: var(--text-secondary); }
  .smart-detail-value { color: var(--text-primary); font-weight: 500; }
  .ai-suggestion-box {
    background: rgba(34,197,94,0.06);
    border: 1px solid rgba(34,197,94,0.15);
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
  }
  .ai-suggestion-title {
    font-size: 13px;
    font-weight: 600;
    color: #22c55e;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ai-suggestion-text {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* 输入框 */
  .input, .textarea, .select {
    width: 100%;
    padding: 9px 13px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 13.5px;
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .input:focus, .textarea:focus, .select:focus {
    border-color: rgba(34, 197, 94, 0.5);
    box-shadow: 0 0 0 3px rgba(34,197,94,0.1), 0 0 20px rgba(34,197,94,0.1);
    background: rgba(0, 0, 0, 0.4);
  }
  .input::placeholder, .textarea::placeholder { color: var(--text-tertiary); }
  .textarea { resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.6; }
  .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: block; font-weight: 500; }

  /* 标签 */
  .tag {
    display: inline-flex; align-items: center;
    padding: 3px 12px; border-radius: 999px;
    font-size: 11.5px;
    background: rgba(34,197,94,0.12);
    color: #4ade80;
    margin: 2px 4px 2px 0;
    font-weight: 500;
    transition: all 0.15s;
    cursor: default;
    border: 1px solid rgba(34,197,94,0.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .tag.cursor-pointer { cursor: pointer; }
  .tag.cursor-pointer:hover { background: rgba(34,197,94,0.22); }
  .tag-green { background: rgba(16,185,129,0.12); color: #6ee7b7; border-color: rgba(16,185,129,0.22); }
  .tag-yellow { background: rgba(245,158,11,0.12); color: #fcd34d; border-color: rgba(245,158,11,0.22); }
  .tag-red { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.22); }
  .tag-gray { background: rgba(255,255,255,0.04); color: var(--text-secondary); border-color: rgba(255,255,255,0.08); }

  /* 右侧面板 */
  .right-panel {
    width: 248px; flex-shrink: 0;
    background: rgba(8, 8, 12, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-left: 1px solid var(--glass-border);
    overflow-y: auto;
    padding: 16px;
  }
  .right-panel-title {
    font-size: 11.5px; font-weight: 600; color: var(--text-tertiary);
    margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
  }
  .bookmark-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 11px; border-radius: 9px;
    cursor: pointer; font-size: 13px;
    color: var(--text-primary);
    transition: all 0.15s;
    margin-bottom: 2px;
    font-weight: 500;
  }
  .bookmark-item:hover { background: var(--bg-card); }
  .bookmark-group { margin-bottom: 18px; }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: rgba(20, 20, 26, 0.85);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    max-width: 90vw; max-height: 85vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 32px 80px rgba(0,0,0,0.6);
    animation: modalIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: -0.1px;
    background: rgba(255,255,255,0.02);
  }
  .modal-body { padding: 22px; overflow-y: auto; }
  .modal-footer {
    padding: 14px 22px;
    border-top: 1px solid var(--glass-border);
    display: flex; justify-content: flex-end; gap: 10px;
    background: rgba(0,0,0,0.2);
  }

  /* AI对话 */
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 200px); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 10px 4px; }
  .chat-msg { display: flex; margin-bottom: 16px; }
  .chat-msg.user { justify-content: flex-end; }
  .chat-bubble {
    max-width: 72%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 13.5px;
    line-height: 1.65;
    word-wrap: break-word;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .chat-msg.user .chat-bubble {
    background: linear-gradient(135deg, var(--accent), #2563eb);
    color: white;
    border-bottom-right-radius: 6px;
    box-shadow: 0 2px 12px var(--accent-glow), 0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .chat-msg.ai .chat-bubble {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-bottom-left-radius: 6px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  }
  .chat-input-area {
    border-top: 1px solid var(--glass-border);
    padding-top: 14px;
    display: flex; gap: 8px;
  }

  /* 计时器 */
  .timer-display {
    font-size: 72px; font-weight: 200;
    font-family: 'SF Mono', Monaco, Consolas, monospace;
    text-align: center;
    letter-spacing: 4px;

<script>
// ===================== 工具函数 =====================
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 6);

function toast(msg, type = 'info') {
  const colors = { info: 'var(--accent)', success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)' };
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderLeftColor = colors[type];
  t.style.borderLeftWidth = '3px';
  t.innerHTML = msg;
  $('toastContainer').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; }, 2000);
  setTimeout(() => t.remove(), 2400);
}

function confirmDialog(title, message, onConfirm) {
  const html = `
    <div class="modal-mask" onclick="if(event.target===this)this.remove()">
      <div class="modal" style="width:420px;">
        <div class="modal-header">${title}</div>
        <div class="modal-body"><p style="color:var(--text-secondary);">${message}</p></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-mask').remove()">取消</button>
          <button class="btn btn-danger" id="confirmBtn">确认</button>
        </div>
      </div>
    </div>`;
  $('modalContainer').innerHTML = html;
  $('confirmBtn').onclick = () => { $('modalContainer').innerHTML = ''; onConfirm(); };
}

// ===================== 数据存储 =====================
const STORAGE_KEY = 'nanzao_workbench_data_v1';
const DEFAULT_DATA = {
  settings: { accentColor: '#3b82f6', fontSize: 14, vaultPassword: '' },
  prompts: [],
  notes: [],
  snippets: [],
  aiSessions: [],
  aiSettings: { apiKey: '', model: 'glm-4-flash', baseUrl: 'https://open.bigmodel.cn/api/paas/v4', systemPrompt: '', corsProxy: '' },
  todos: [],
  timerRecords: [],
  vault: [],
  vaultUnlocked: false,
  materials: [],
  customers: [],
  agents: [],
  copywritings: [],
  devledger: [],
  bookmarks: [
    { id: uid(), name: 'TRAE', url: 'https://www.trae.ai', group: '开发工具' },
    { id: uid(), name: 'AI绘图', url: 'https://www.midjourney.com', group: '开发工具' },
    { id: uid(), name: 'GitHub', url: 'https://github.com', group: '开发工具' },
    { id: uid(), name: 'DCloud uni-app', url: 'https://uniapp.dcloud.net.cn', group: '开发工具' },
    { id: uid(), name: 'uniCloud控制台', url: 'https://unicloud.dcloud.net.cn', group: '开发工具' },
  ],
};

let appData = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const parsed = JSON.parse(raw);
    return { ...JSON.parse(JSON.stringify(DEFAULT_DATA)), ...parsed };
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

// 简单加密（可逆，仅防偷窥）
function simpleEncrypt(str, key) {
  if (!key) return str;
  let result = '';
  for (let i = 0; i < str.length; i++) {
    result += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return btoa(unescape(encodeURIComponent(result)));
}
function simpleDecrypt(str, key) {
  if (!key) return str;
  try {
    str = decodeURIComponent(escape(atob(str)));
    let result = '';
    for (let i = 0; i < str.length; i++) {
      result += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return result;
  } catch { return ''; }
}

// ===================== 路由 =====================
let currentPage = 'prompts';
let currentBusinessTab = 'materials';

function toggleSidebar() {
  const sb = $('sidebar');
  const ov = $('sidebarOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  // 移动端切换页面后自动关闭侧边栏
  if (window.innerWidth <= 768) {
    $('sidebar')?.classList.remove('open');
    $('sidebarOverlay')?.classList.remove('show');
  }
  renderPage();
}

function renderPage() {
  const area = $('contentArea');
  const renderers = {
    prompts: renderPrompts,
    notes: renderNotes,
    snippets: renderSnippets,
    ai: renderAI,
    todos: renderTodos,
    timer: renderTimer,
    vault: renderVault,
    business: renderBusiness,
    bookmarks: renderBookmarksPage,
  };
  (renderers[currentPage] || (() => area.innerHTML = '<div class="empty-state">页面开发中</div>'))();
}

// ===================== 提示词库 =====================
function renderPrompts() {
  const tagsAll = [...new Set(appData.prompts.flatMap(p => p.tags || []))];
  const categories = ['南崽奢链开发提示词', 'TRAE代码指令', 'AI绘图提示词', '短视频口播脚本'];
  const area = $('contentArea');
  area.innerHTML = `
    <div class="page-header">
      <div class="page-title">💡 提示词库</div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openPromptModal()">+ 新建提示词</button>
      </div>
    </div>
    <div class="card mb-3">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-sm text-gray">分类：</span>
        <span class="tag cursor-pointer" onclick="filterPrompts('')" id="pf_all">全部</span>
        ${categories.map(c => `<span class="tag cursor-pointer" onclick="filterPrompts('${c}')">${c}</span>`).join('')}
        ${tagsAll.filter(t => !categories.includes(t)).map(t => `<span class="tag tag-gray cursor-pointer" onclick="filterPrompts('${t}')">#${t}</span>`).join('')}
      </div>
    </div>
    <div class="grid-cards" id="promptsGrid"></div>
  `;
  renderPromptsGrid('');
}

let promptFilter = '';
function filterPrompts(tag) {
  promptFilter = tag;
  renderPromptsGrid(tag);
}

function renderPromptsGrid(tag) {
  const list = tag ? appData.prompts.filter(p => (p.tags || []).includes(tag)) : appData.prompts;
  const grid = $('promptsGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">📭</div>暂无提示词，点击右上角新建</div>';
    return;
  }
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="flex justify-between items-start mb-2">
        <div class="font-semibold">${p.title}</div>
        <div class="flex gap-1">
          <button class="btn btn-secondary btn-sm" onclick="copyText(\`${escapeHtml(p.content)}\`)">📋</button>
          <button class="btn btn-secondary btn-sm" onclick="openPromptModal('${p.id}')">✏️</button>
          <button class="btn btn-secondary btn-sm" onclick="deletePrompt('${p.id}')">🗑️</button>
        </div>
      </div>
      <div class="text-sm text-gray mb-2 truncate" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${escapeHtml(p.content)}</div>
      <div class="flex flex-wrap">${(p.tags || []).map(t => `<span class="tag tag-gray">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function openPromptModal(id) {
  const p = id ? appData.prompts.find(x => x.id === id) : { title: '', content: '', tags: [] };
  const categories = ['南崽奢链开发提示词', 'TRAE代码指令', 'AI绘图提示词', '短视频口播脚本'];
  const html = `
    <div class="modal-mask" onclick="if(event.target===this)this.remove()">
      <div class="modal" style="width:620px;">
        <div class="modal-header">${id ? '编辑' : '新建'}提示词</div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="label">标题</label>
            <input class="input" id="pm_title" value="${escapeHtml(p.title)}">
          </div>
          <div class="mb-3">
            <label class="label">标签（逗号分隔）</label>
            <input class="input" id="pm_tags" value="${(p.tags || []).join(', ')}">
            <div class="mt-2">
              ${categories.map(c => `<span class="tag tag-gray cursor-pointer" onclick="document.getElementById('pm_tags').value+=(document.getElementById('pm_tags').value?', ':'')+'${c}'">+${c}</span>`).join('')}
            </div>
          </div>

  appData.prompts.unshift({ id: uid(), title: 'AI输出保存-' + new Date().toLocaleString(), content, tags: ['AI输出'], createdAt: Date.now() });
  saveData(); toast('已保存到提示词库', 'success');
}

async function sendAIMessage() {
  const input = $('aiInput');
  const content = input.value.trim();
  if (!content) return;
  if (!appData.aiSettings.apiKey) { toast('请先在API设置中填入API-Key', 'error'); openAISettings(); return; }
  if (!currentAISession) newAISession();

  currentAISession.messages.push({ role: 'user', content });
  currentAISession.updatedAt = Date.now();
  if (!currentAISession.title) currentAISession.title = content.slice(0, 30);
  input.value = '';
  renderAISessions();
  renderAIMessages();
  saveData();

  // 发送请求
  const loadingMsg = { role: 'ai', content: '⏳ 思考中...', loading: true };
  currentAISession.messages.push(loadingMsg);
  renderAIMessages();

  try {
    const apiKey = appData.aiSettings.apiKey;
    const model = appData.aiSettings.model;
    const baseUrl = appData.aiSettings.baseUrl || 'https://open.bigmodel.cn/api/paas/v4';
    const systemPrompt = appData.aiSettings.systemPrompt || '你是智谱AI助手，一个专业可靠的全栈开发和商业顾问。';
    
    const messages = [
      { role: 'system', content: systemPrompt },
      ...currentAISession.messages.filter(m => !m.loading).map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content }))
    ];

    const fullUrl = appData.aiSettings.corsProxy ? appData.aiSettings.corsProxy + baseUrl + '/chat/completions' : baseUrl + '/chat/completions';

    const res = await fetch(fullUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`,
      },
      body: JSON.stringify({ model, messages, stream: false })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || '（无响应内容）';
    
    const idx = currentAISession.messages.findIndex(m => m.loading);
    if (idx >= 0) currentAISession.messages.splice(idx, 1);
    currentAISession.messages.push({ role: 'ai', content: reply });
    currentAISession.updatedAt = Date.now();
  } catch (e) {
    const idx = currentAISession.messages.findIndex(m => m.loading);
    if (idx >= 0) currentAISession.messages.splice(idx, 1);
    currentAISession.messages.push({ role: 'ai', content: `❌ 请求失败：${e.message}\n\n可能原因：1.API-Key无效 2.网络问题 3.模型名称错误 4.接口地址不正确` });
  }
  saveData();
  renderAIMessages();
}

  if (!currentAISession) return;
  confirmDialog('清空对话', '确定清空当前会话的所有消息？', () => {

  grid.innerHTML = html;
}

}

async function aiGenerateTodos() {
  const prompt = $('ai_todo_prompt').value.trim();
  const count = $('ai_todo_count').value;
  const project = $('ai_todo_project').value;
  if (!prompt) { toast('请描述你的目标', 'error'); return; }

  const btn = $('ai_todo_gen_btn');
  btn.disabled = true;
  btn.innerHTML = '⏳ 生成中...';

  try {
    const apiKey = appData.aiSettings.apiKey;
    const baseUrl = appData.aiSettings.baseUrl || 'https://open.bigmodel.cn/api/paas/v4';
    const model = appData.aiSettings.model || 'glm-4-flash';
    const systemPrompt = `你是一个专业的任务管理助手。请将用户的目标拆解成${count}个具体可执行的待办任务，按优先级从高到低排列。

请严格按以下JSON格式返回，不要返回其他文字：
{
  "tasks": [
    {
      "title": "任务标题（简洁明确）",
      "notes": "任务说明或备注（一句话）",
      "priority": "high" 或 "medium" 或 "low"
    }
  ]
}

要求：
- title 要具体可执行，不要模糊
- priority 根据任务重要性和紧急度分配
- 按执行顺序排列，第一个是最优先的
- 返回合法JSON，不要Markdown代码块`;

    const res = await fetch(baseUrl + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`,
      },
      body: JSON.stringify({
        model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: `我的目标是：${prompt}\n\n请拆解成${count}个待办任务。` }
        ],
        stream: false
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const content = data.choices?.[0]?.message?.content || '';
    
    // 提取 JSON
    let jsonStr = content;
    const jsonMatch = content.match(/\{[\s\S]*\}/);
    if (jsonMatch) jsonStr = jsonMatch[0];
    
    let parsed;
    try { parsed = JSON.parse(jsonStr); } catch (e) { throw new Error('AI返回格式不正确'); }
    
    const tasks = parsed.tasks || [];
    if (!tasks.length) throw new Error('未生成任务');

    // 插入任务
    let added = 0;
    tasks.forEach(t => {
      if (t.title) {
        appData.todos.unshift({
          id: uid(),
          title: t.title,
          notes: t.notes || '',
          priority: t.priority || 'medium',
          project: project,
          done: false,
          createdAt: Date.now()
        });
        added++;
      }
    });

    saveData();
    $('modalContainer').innerHTML = '';
    renderTodos();
    toast(`✨ 已生成 ${added} 个任务`, 'success');
  } catch (e) {
    toast('生成失败：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🤖 开始生成';
  }
}

function toggleTodo(id) {
  const t = appData.todos.find(x => x.id === id);

function formatDuration(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function toggleTimer() {
  timerRunning = !timerRunning;
  const btn = $('timerStartBtn');
  if (timerRunning) {
    btn.innerHTML = '⏸️ 暂停';
    btn.className = 'btn btn-warning';
    timerInterval = setInterval(() => {
      timerSeconds++;
      if ($('timerDisplay')) $('timerDisplay').textContent = formatDuration(timerSeconds);
    }, 1000);
  } else {
    btn.innerHTML = '▶️ 继续';
    btn.className = 'btn btn-primary';
    clearInterval(timerInterval);
  }
}

function resetTimer() {
  if (timerSeconds === 0) return;
  confirmDialog('重置确认', '确定重置计时器？当前计时将丢失。', () => {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 0;
    $('timerDisplay').textContent = '00:00:00';
    const btn = $('timerStartBtn');
    btn.innerHTML = '▶️ 开始';
    btn.className = 'btn btn-primary';
  });
}

function saveTimerRecord() {
  if (timerSeconds < 10) { toast('计时太短（至少10秒）', 'warning'); return; }
  const wasRunning = timerRunning;
  if (wasRunning) toggleTimer();
  appData.timerRecords.push({
    id: uid(),
    startAt: Date.now() - timerSeconds * 1000,
    duration: timerSeconds,
    project: $('timerProject').value,
    note: $('timerNote').value,
  });
  saveData();
  timerSeconds = 0;
  $('timerDisplay').textContent = '00:00:00';
  $('timerNote').value = '';
  renderTimer();
  toast('记录已保存', 'success');
}

function deleteTimerRecord(id) {
  confirmDialog('删除确认', '确定删除这条计时记录？', () => {
    appData.timerRecords = appData.timerRecords.filter(r => r.id !== id);
    saveData();
    renderTimerHistory();
    toast('已删除', 'success');
  });
}

function setVaultPassword() {
  const p1 = $('vp_pwd1').value, p2 = $('vp_pwd2').value;
  if (p1.length < 4) { toast('密码至少4位', 'error'); return; }
  if (p1 !== p2) { toast('两次密码不一致', 'error'); return; }
  appData.vaultPassword = btoa(p1);
  appData.vaultUnlocked = true;
  saveData();
  toast('密码设置成功', 'success');
  renderVault();
}

function unlockVault() {
  const p = $('vp_pwd').value;
  if (atob(appData.vaultPassword) === p) {
    appData.vaultUnlocked = true;
    saveData();
    renderVault();
    toast('解锁成功', 'success');
  } else {
    toast('密码错误', 'error');

}

function resetVault() {
  confirmDialog('重置保险箱', '此操作将清空所有密钥数据并重置密码，确定吗？', () => {

                <button class="btn ${s.accentColor===c?'btn-primary':'btn-secondary'}" style="background:${s.accentColor===c?c:'transparent'};border-color:${c};" onclick="document.getElementById('st_color').value='${c}';this.closest('.modal-body').querySelectorAll('button').forEach(b=>{b.classList.remove('btn-primary');b.classList.add('btn-secondary');b.style.background='transparent'});this.classList.add('btn-primary');this.classList.remove('btn-secondary');this.style.background='${c}';">${n}</button>
              `).join('')}
              <input type="hidden" id="st_color" value="${s.accentColor}">
            </div>
          </div>
          <div class="mb-3">
            <label class="label">基础字体大小: <span id="st_fs_val">${s.fontSize}px</span></label>
            <input type="range" min="12" max="18" value="${s.fontSize}" class="w-full" oninput="$('st_fs').value=this.value;$('st_fs_val').textContent=this.value+'px';">
            <input type="hidden" id="st_fs" value="${s.fontSize}">
          </div>
          <div class="mb-3">
            <label class="label">数据管理</label>
            <div class="flex gap-2 flex-wrap">
              <button class="btn btn-secondary btn-sm" onclick="exportData()">📤 导出数据</button>
              <button class="btn btn-secondary btn-sm" onclick="clearAllData()">🗑️ 清空所有数据</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="this.closest('.modal-mask').remove()">取消</button>
          <button class="btn btn-primary" onclick="saveSettings()">保存</button>
        </div>
      </div>
    </div>`;
  $('modalContainer').innerHTML = html;
}

function saveSettings() {
  appData.settings.accentColor = $('st_color').value;
  appData.settings.fontSize = Number($('st_fs').value);
  document.documentElement.style.setProperty('--accent', appData.settings.accentColor);
  document.body.style.fontSize = appData.settings.fontSize + 'px';
  saveData();
  $('modalContainer').innerHTML = '';
  toast('设置已保存', 'success');
}

// ===================== 导入导出 =====================
function exportData() {
  const dataStr = JSON.stringify(appData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nanzao_workbench_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出数据备份', 'success');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      confirmDialog('导入确认', '将覆盖当前所有数据，确定继续吗？', () => {
        appData = { ...JSON.parse(JSON.stringify(DEFAULT_DATA)), ...data };
        saveData();
        location.reload();
      });
    } catch (err) {
      toast('文件格式错误', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function clearAllData() {
  confirmDialog('⚠️ 危险操作', '此操作将清空所有本地数据且不可恢复！确定吗？', () => {
    confirmDialog('⚠️ 二次确认', '真的确定要清空所有数据吗？', () => {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    });
  });
}

// ===================== 全局搜索 =====================
$('globalSearch').addEventListener('input', function() {
  const kw = this.value.trim().toLowerCase();
  if (!kw) return;
  // 做一个简单的结果展示
  const results = [];
  appData.prompts.forEach(p => { if ((p.title + p.content).toLowerCase().includes(kw)) results.push({ type: '提示词', title: p.title, page: 'prompts' }); });
  appData.notes.forEach(n => { if ((n.title + n.content).toLowerCase().includes(kw)) results.push({ type: '笔记', title: n.title, page: 'notes' }); });
  appData.snippets.forEach(s => { if ((s.title + s.code).toLowerCase().includes(kw)) results.push({ type: '代码片段', title: s.title, page: 'snippets' }); });
  appData.materials.forEach(m => { if ((m.name + m.notes).toLowerCase().includes(kw)) results.push({ type: '素材', title: m.name, page: 'business', sub: 'materials' }); });
  appData.customers.forEach(c => { if ((c.nickname + c.intention).toLowerCase().includes(kw)) results.push({ type: '客户', title: c.nickname, page: 'business', sub: 'customers' }); });
  appData.copywritings.forEach(c => { if ((c.title + c.content).toLowerCase().includes(kw)) results.push({ type: '文案', title: c.title, page: 'business', sub: 'copywritings' }); });
  appData.todos.forEach(t => { if ((t.title + t.notes).toLowerCase().includes(kw)) results.push({ type: '任务', title: t.title, page: 'todos' }); });

  if (results.length) {
    toast(`找到 ${results.length} 条相关结果，类型：${[...new Set(results.map(r=>r.type))].join('、')}。跳转到对应模块查看。`, 'info');
    // 自动跳转到第一个结果的模块
    const first = results[0];
    if (first.page !== currentPage) {
      switchPage(first.page);
      if (first.sub) { currentBusinessTab = first.sub; renderBusiness(); }
    }
  }
});

// ===================== 3D 流体粒子卡片系统 =====================
class ParticleCard {
  constructor(el) {
    this.el = el;
    this.ctx = null;
    this.particles = [];
    this.mouseX = 0.5;
    this.mouseY = 0.5;
    this.hovering = false;
    this.animFrame = null;
    this.w = 0;
    this.h = 0;

    // 创建 canvas
    this.canvas = document.createElement('canvas');
    this.canvas.className = 'particle-canvas';
    this.canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;border-radius:inherit;';
    el.style.position = 'relative';
    el.style.overflow = 'hidden';
    el.insertBefore(this.canvas, el.firstChild);

    // 光晕层
    this.shine = document.createElement('div');
    this.shine.className = 'card-shine';
    el.appendChild(this.shine);

    this.glow = document.createElement('div');
    this.glow.className = 'card-glow';
    el.appendChild(this.glow);

    this.resize();
    this.initParticles();
    this.bindEvents();
    this.animate();
  }

  resize() {
    const rect = this.el.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = rect.width;
    this.h = rect.height;
    this.canvas.width = this.w * dpr;
    this.canvas.height = this.h * dpr;
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    this.ctx = this.canvas.getContext('2d');
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  initParticles() {
    this.particles = [];
    const area = this.w * this.h;
    const count = Math.max(15, Math.min(40, Math.floor(area / 5000)));
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: Math.random() * this.w,
        y: Math.random() * this.h,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        r: Math.random() * 2.5 + 1,
        alpha: Math.random() * 0.5 + 0.2,
        hue: Math.random() > 0.5 ? 142 : 210,
      });
    }
  }

  bindEvents() {
    const isMobile = 'ontouchstart' in window;

    if (!isMobile) {
      this.el.addEventListener('mousemove', (e) => {
        const rect = this.el.getBoundingClientRect();
        this.mouseX = (e.clientX - rect.left) / rect.width;
        this.mouseY = (e.clientY - rect.top) / rect.height;
        this.hovering = true;
        this.el.classList.remove('touching');

        const rotX = (this.mouseY - 0.5) * -10;
        const rotY = (this.mouseX - 0.5) * 10;
        this.el.style.transform = `perspective(600px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateZ(10px)`;

        this.shine.style.setProperty('--mx', `${this.mouseX * 100}%`);
        this.shine.style.setProperty('--my', `${this.mouseY * 100}%`);
      });

      this.el.addEventListener('mouseleave', () => {
        this.hovering = false;
        this.el.style.transform = '';
      });

      this.el.addEventListener('mouseenter', () => {
        this.hovering = true;
      });
    } else {
      this.el.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        const rect = this.el.getBoundingClientRect();
        this.mouseX = (touch.clientX - rect.left) / rect.width;
        this.mouseY = (touch.clientY - rect.top) / rect.height;
        this.hovering = true;
        this.el.classList.add('touching');

        const rotX = (this.mouseY - 0.5) * -6;
        const rotY = (this.mouseX - 0.5) * 6;
        this.el.style.transform = `perspective(600px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateZ(5px)`;

        this.shine.style.setProperty('--mx', `${this.mouseX * 100}%`);
        this.shine.style.setProperty('--my', `${this.mouseY * 100}%`);
      }, { passive: true });

      this.el.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        const rect = this.el.getBoundingClientRect();
        this.mouseX = (touch.clientX - rect.left) / rect.width;
        this.mouseY = (touch.clientY - rect.top) / rect.height;

        const rotX = (this.mouseY - 0.5) * -6;
        const rotY = (this.mouseX - 0.5) * 6;
        this.el.style.transform = `perspective(600px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateZ(5px)`;

        this.shine.style.setProperty('--mx', `${this.mouseX * 100}%`);
        this.shine.style.setProperty('--my', `${this.mouseY * 100}%`);
      }, { passive: true });

      this.el.addEventListener('touchend', () => {
        this.hovering = false;
        this.el.classList.remove('touching');
        this.el.style.transform = '';
      }, { passive: true });
    }

    this._onResize = () => { this.resize(); this.initParticles(); };
    window.addEventListener('resize', this._onResize);
  }

  animate() {
    if (!this.ctx) { this.animFrame = requestAnimationFrame(() => this.animate()); return; }
    this.ctx.clearRect(0, 0, this.w, this.h);

    const mx = this.mouseX * this.w;
    const my = this.mouseY * this.h;
    const particles = this.particles;
    const len = particles.length;

    for (let i = 0; i < len; i++) {
      const p = particles[i];

      // 鼠标/触摸吸引
      if (this.hovering) {
        const dx = mx - p.x;
        const dy = my - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150 && dist > 0) {
          const force = (150 - dist) / 150 * 0.02;
          p.vx += dx * force;
          p.vy += dy * force;
        }
      }

      // 阻尼
      p.vx *= 0.98;
      p.vy *= 0.98;

      // 基础漂浮
      p.vx += (Math.random() - 0.5) * 0.05;
      p.vy += (Math.random() - 0.5) * 0.05;

      p.x += p.vx;
      p.y += p.vy;

      // 边界
      if (p.x < 0) { p.x = 0; p.vx *= -0.5; }
      if (p.x > this.w) { p.x = this.w; p.vx *= -0.5; }
      if (p.y < 0) { p.y = 0; p.vy *= -0.5; }
      if (p.y > this.h) { p.y = this.h; p.vy *= -0.5; }

      // 绘制粒子（更大更亮）
      const a = this.hovering ? p.alpha * 2 : p.alpha;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.r * (this.hovering ? 1.3 : 1), 0, Math.PI * 2);
      this.ctx.fillStyle = `hsla(${p.hue}, 85%, 65%, ${a})`;
      this.ctx.fill();

      // 发光效果
      if (this.hovering) {
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        this.ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, ${a * 0.15})`;
        this.ctx.fill();
      }
    }

    // 粒子连线
    for (let i = 0; i < len; i++) {
      for (let j = i + 1; j < len; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          this.ctx.beginPath();
          this.ctx.moveTo(particles[i].x, particles[i].y);
          this.ctx.lineTo(particles[j].x, particles[j].y);
          const la = (1 - dist / 100) * 0.25 * (this.hovering ? 2.5 : 1);
          this.ctx.strokeStyle = `hsla(${particles[i].hue}, 75%, 60%, ${la})`;
          this.ctx.lineWidth = this.hovering ? 1 : 0.5;
          this.ctx.stroke();
        }
      }
    }

    this.animFrame = requestAnimationFrame(() => this.animate());
  }

  destroy() {
    if (this.animFrame) cancelAnimationFrame(this.animFrame);
    window.removeEventListener('resize', this._onResize);
    this.canvas.remove();
    this.shine.remove();
    this.glow.remove();
  }
}

// 全局粒子卡片管理器
const particleCards = new Map();

function initParticleCards() {
  particleCards.forEach((pc) => pc.destroy());
  particleCards.clear();

  const targets = document.querySelectorAll('.card:not(.no-particle), .stat-card:not(.no-particle)');
  targets.forEach(el => {
    if (el.offsetWidth < 50 || el.offsetHeight < 50) return;
    el.classList.add('particle-card');
    const pc = new ParticleCard(el);
    particleCards.set(el, pc);
  });
}

// 在每次页面渲染后初始化粒子
const origRenderPage = renderPage;
renderPage = function() {
  origRenderPage();
  setTimeout(initParticleCards, 100);
};

// ===================== 辅助函数 =====================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/`/g, '&#96;');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板', 'success');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制到剪贴板', 'success');
  }
}

function init() {
  // 应用主题
  document.documentElement.style.setProperty('--accent', appData.settings.accentColor);
  document.body.style.fontSize = (appData.settings.fontSize || 14) + 'px';
  
  // marked配置
  marked.setOptions({ breaks: true, gfm: true });

  // 渲染右侧书签
  renderRightBookmarks();

  // 渲染首屏
  renderPage();
}

init();
