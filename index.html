// 解析链式引用 {{task_x}} → 前面任务的结果
function resolveChainRefs(text) {
  return text.replace(/\{\{(\w+)\}\}/g, (match, varName) => {
    // 查找之前已完成的任务结果
    for (let i = 0; i < wfResults.length; i++) {
      const task = currentWorkflow.tasks[i];
      if (task.expert?.resultVar === varName && wfResults[i].status === 'done') {
        return wfResults[i].result;
      }
    }
    // 也支持 {{task_1}} {{task_2}} 按序号引用
    const numMatch = varName.match(/^task_(\d+)$/);
    if (numMatch) {
      const idx = parseInt(numMatch[1]) - 1;
      if (idx >= 0 && idx < wfResults.length && wfResults[idx].status === 'done') {
        return wfResults[idx].result;
      }
    }
    return match; // 未找到则保留原文
  });
}

// ===================== 工作流执行引擎 =====================
async function startWorkflow() {
  const wf = currentWorkflow;
  if (!wf || wf.tasks.length === 0) { toast('请先添加任务', 'warning'); return; }
  if (!appData.aiSettings.apiKey) { toast('请先配置AI API Key', 'error'); return; }

  wfRunning = true;
  wfStopFlag = false;
  wfResults = wf.tasks.map(() => ({ status: 'waiting', result: '' }));
  wfLogs = [];

  renderWorkflow();
  addLog('info', `开始执行工作流：${wf.name}`);
  addLog('info', `共 ${wf.tasks.length} 个任务`);

  for (let i = 0; i < wf.tasks.length; i++) {
    if (wfStopFlag) {
      addLog('warn', '用户停止执行');
      break;
    }

    const task = wf.tasks[i];
    wfResults[i].status = 'running';
    updateTaskUI(i);
    addLog('info', `执行任务 ${i + 1}/${wf.tasks.length}：${task.title}`);

    try {
      if (task.type === 'ai') {
        await executeAITask(i, task);
      } else if (task.type === 'delay') {
        await executeDelayTask(i, task);
      } else if (task.type === 'export') {
        await executeExportTask(i, task);
      }
    } catch (err) {
      wfResults[i].status = 'error';
      wfResults[i].result = err.message;
      addLog('error', `任务失败：${err.message}`);
    }

    updateTaskUI(i);
    updateProgress();
  }

  wfRunning = false;
  const doneCount = wfResults.filter(r => r.status === 'done').length;
  addLog('success', `执行完成：${doneCount}/${wf.tasks.length} 个任务成功`);

  // 显示结果汇总
  showResults();

  const btn = $('wfRunBtn');
  if (btn) {
    btn.className = 'wf-run-btn go';
    btn.textContent = '▶ 开始自动执行';
    btn.disabled = false;
  }
}

function stopWorkflow() {
  wfStopFlag = true;
  addLog('warn', '正在停止...');
}

async function executeAITask(index, task) {
  const apiKey = appData.aiSettings.apiKey;
  const exp = task.expert || {};

  // 使用专家模式参数或默认值
  const model = exp.model || appData.aiSettings.model || 'glm-4-flash';
  const baseUrl = appData.aiSettings.baseUrl || 'https://open.bigmodel.cn/api/paas/v4';
  const temperature = exp.temperature ?? 0.8;
  const maxTokens = exp.maxTokens || 2000;
  const systemPrompt = exp.systemPrompt || '你是一个专业的内容生成助手，请严格按照用户要求生成内容，不要添加多余的解释。';

  // 解析链式引用
  const resolvedPrompt = resolveChainRefs(task.prompt);

  const messages = [
    { role: 'system', content: systemPrompt },
    { role: 'user', content: resolvedPrompt }
  ];

  addLog('info', `模型: ${model} | Temperature: ${temperature} | MaxTokens: ${maxTokens}`);

  const response = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model,
      messages,
      temperature,
      max_tokens: maxTokens
    })
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`API请求失败：${response.status} - ${errText}`);
  }

  const data = await response.json();
  const content = data.choices?.[0]?.message?.content || '无内容';

  wfResults[index].status = 'done';
  wfResults[index].result = content;
  addLog('success', `AI生成完成，${content.length} 字`);
}

async function executeDelayTask(index, task) {
  const seconds = task.seconds || 2;
  addLog('info', `等待 ${seconds} 秒...`);

  await new Promise(resolve => setTimeout(resolve, seconds * 1000));

  wfResults[index].status = 'done';
  wfResults[index].result = `延时 ${seconds} 秒完成`;
  addLog('success', `延时完成`);
}

async function executeExportTask(index, task) {
  wfResults[index].status = 'done';
  wfResults[index].result = '准备导出';
  addLog('info', '导出任务已标记');
}

function addLog(type, message) {
  const time = new Date().toLocaleTimeString();
  wfLogs.push({ type, message, time });

  const logArea = $('wfLogArea');
  if (logArea) {
    const line = document.createElement('div');
    line.className = 'wf-log-line';
    line.innerHTML = `<span class="wf-log-time">[${time}]</span> <span class="wf-log-${type}">${escapeHtml(message)}</span>`;
    logArea.appendChild(line);
    logArea.scrollTop = logArea.scrollHeight;
  }
}

function updateTaskUI(index) {
  const el = document.getElementById(`wfTask_${index}`);
  if (!el) return;

  const result = wfResults[index];
  el.className = `wf-task-item ${result.status}`;

  const numEl = el.querySelector('.wf-task-num');
  if (numEl) {
    numEl.textContent = result.status === 'done' ? '✓' : result.status === 'error' ? '✗' : result.status === 'running' ? '⟳' : (index + 1);
  }

  // 添加结果文本
  let resultEl = el.querySelector('.wf-task-result');
  if (result && result.result) {
    if (!resultEl) {
      resultEl = document.createElement('div');
      resultEl.className = 'wf-task-result';
      el.querySelector('.wf-task-info').appendChild(resultEl);
    }
    resultEl.textContent = result.result.substring(0, 80) + (result.result.length > 80 ? '...' : '');
  }
}

function updateProgress() {
  const wf = currentWorkflow;
  if (!wf) return;

  const progress = wfResults.filter(r => r.status === 'done').length / wf.tasks.length * 100;
  const fill = document.querySelector('.wf-progress-fill');
  if (fill) fill.style.width = `${progress}%`;
}

function showResults() {
  const resultArea = $('wfResultArea');
  const resultContent = $('wfResultContent');

  if (!resultArea || !resultContent) return;

  const aiResults = wfResults.filter((r, i) => currentWorkflow.tasks[i].type === 'ai' && r.status === 'done');

  if (aiResults.length === 0) {
    resultArea.style.display = 'none';
    return;
  }

  let html = '';
  aiResults.forEach((r, idx) => {
    const task = currentWorkflow.tasks.find(t => t.type === 'ai' && wfResults.indexOf(r) >= 0);
    html += `【任务 ${idx + 1}】\n${r.result}\n\n`;
  });

  resultContent.textContent = html;
  resultArea.style.display = 'block';
}

function downloadWorkflowResults() {
  const aiResults = wfResults.filter((r, i) => currentWorkflow.tasks[i].type === 'ai' && r.status === 'done');

  if (aiResults.length === 0) {
    toast('没有可导出的AI生成结果', 'warning');
    return;
  }

  let content = `工作流：${currentWorkflow.name}\n`;
  content += `执行时间：${new Date().toLocaleString()}\n`;
  content += `${'='.repeat(50)}\n\n`;

  aiResults.forEach((r, idx) => {
    content += `【任务 ${idx + 1}】\n${r.result}\n\n`;
    content += `${'-'.repeat(50)}\n\n`;
  });

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentWorkflow.name || '工作流结果'}_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);

  toast('文件已下载', 'success');
}

// ===================== 卡片 3D 倾斜 + 光晕交互效果（轻量版） =====================
// 注：旧版粒子系统已弃用，改用 initCardParticleSystems（支持主题切换）。
// 仅保留卡片交互效果（3D 倾斜 + 光晕），不含粒子点阵。

(function() {
  const isMobile = 'ontouchstart' in window;

  function initCardEffects() {
    const targets = document.querySelectorAll('.card:not(.no-particle), .stack-3d-card:not(.no-particle)');
    targets.forEach(el => {
      if (el._cardEffectBound) return;
      el._cardEffectBound = true;
      el.style.position = 'relative';
      el.style.overflow = 'hidden';
      el.style.transformStyle = 'preserve-3d';
      el.style.willChange = 'transform';

      // 光晕层
      const shine = document.createElement('div');
      shine.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:2;border-radius:inherit;opacity:0;transition:opacity 0.3s;';
      el.appendChild(shine);

      // 外发光层
      const glow = document.createElement('div');
      glow.style.cssText = 'position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity 0.4s;filter:blur(8px);background:linear-gradient(135deg,rgba(34,197,94,0.2),transparent 50%,rgba(59,130,246,0.15));';
      el.appendChild(glow);

      let rafId = null;
      let targetRotX = 0, targetRotY = 0;
      let currentRotX = 0, currentRotY = 0;

      function applyTransform() {
        // 平滑插值跟随
        currentRotX += (targetRotX - currentRotX) * 0.2;
        currentRotY += (targetRotY - currentRotY) * 0.2;
        el.style.transform = `perspective(1000px) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg) scale3d(1.03,1.03,1.03)`;
        if (Math.abs(targetRotX - currentRotX) > 0.05 || Math.abs(targetRotY - currentRotY) > 0.05) {
          rafId = requestAnimationFrame(applyTransform);
        } else {
          rafId = null;
        }
      }

      const onMove = (cx, cy) => {
        const rect = el.getBoundingClientRect();
        const mx = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
        const my = Math.max(0, Math.min(1, (cy - rect.top) / rect.height));

        // 增大倾斜角度，效果更明显
        targetRotX = (my - 0.5) * -20;
        targetRotY = (mx - 0.5) * 20;

        if (!rafId) rafId = requestAnimationFrame(applyTransform);

        shine.style.background = `radial-gradient(circle at ${mx*100}% ${my*100}%, rgba(255,255,255,0.2) 0%, transparent 60%)`;
        shine.style.opacity = '1';
        glow.style.opacity = '1';
      };

      const onLeave = () => {
        targetRotX = 0; targetRotY = 0;
        if (!rafId) rafId = requestAnimationFrame(applyTransform);
        shine.style.opacity = '0';
        glow.style.opacity = '0';
      };

      if (isMobile) {
        el.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          onMove(t.clientX, t.clientY);
          el.classList.add('touching');
        }, { passive: true });
        el.addEventListener('touchmove', (e) => {
          const t = e.touches[0];
          onMove(t.clientX, t.clientY);
        }, { passive: true });
        el.addEventListener('touchend', () => { onLeave(); el.classList.remove('touching'); }, { passive: true });
        el.addEventListener('touchcancel', () => { onLeave(); el.classList.remove('touching'); }, { passive: true });
      } else {
        el.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
        el.addEventListener('mouseleave', onLeave);
      }
    });
  }

  // 每次页面渲染后初始化卡片效果
  const origRenderPage = window.renderPage;
  if (origRenderPage) {
    window.renderPage = function() {
      origRenderPage();
      setTimeout(initCardEffects, 150);
      setTimeout(applyCardEntrance, 200);
    };
  }
  // 首屏初始化
  setTimeout(initCardEffects, 300);
  setTimeout(applyCardEntrance, 350);

  function applyCardEntrance() {
    const cards = document.querySelectorAll('.card:not(.no-particle), .stack-3d-card:not(.no-particle)');
    cards.forEach((el, i) => {
      el.style.animationDelay = `${i * 0.06}s`;
      // 动画结束后清除 animation，避免 transform 与 JS 3D 倾斜冲突
      el.addEventListener('animationend', () => {
        el.style.animation = 'none';
      }, { once: true });
    });
  }
})();

// ===================== 辅助函数 =====================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/`/g, '&#96;');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板', 'success');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('已复制到剪贴板', 'success');
  }
}

// ===================== 全局粒子系统 + MediaPipe 手势识别 + 御剑特效 =====================
let cardParticleSystems = []; // [{ el, canvas, ctx, particles, splashes, w, h, _shapePts }]
let currentParticleTheme = 'stars';
let globalAnimFrame = null;
let pointer = { x: -1000, y: -1000, active: false, vx: 0, vy: 0, prevX: 0, prevY: 0, downTime: 0 };
let swordCenter = { x: 0, y: 0, tx: 0, ty: 0, active: false, spread: 1 };
// 粒子布局形态：'free' 自由 / '1'-'4' 聚成数字 / 'heart' 聚成 I❤U
let particleShapeMode = 'free';
let shapePoints = [];

const gestureCam = { hands: null, video: null, on: false, raf: null, lastSwitch: 0, bridge: null, bridgeCtx: null };

const PARTICLE_THEMES = {
  stars: { name: '星空', colors: ['#ffffff','#ffeaa7','#74b9ff','#a29bfe','#fd79a8'], count: 80, speed: 0.3, size: [0.6, 2.6], behavior: 'float', glow: true },
  rain:  { name: '雨滴', colors: ['#a8d8ff','#74b9ff','#0984e3','#dfe6e9'], count: 200, speed: 6, size: [1, 3], behavior: 'rain' },
  snow:  { name: '飘雪', colors: ['#ffffff','#dfe6e9','#b2bec3'], count: 50, speed: 1.0, size: [1.5, 3.5], behavior: 'snow', glow: true },
  fireflies: { name: '萤火虫', colors: ['#ffeaa7','#fdcb6e','#e17055','#00b894'], count: 55, speed: 0.8, size: [2, 5], behavior: 'wander', glow: true },
  aurora:{ name: '极光', colors: ['#00b894','#00cec9','#0984e3','#6c5ce7','#fd79a8'], count: 45, speed: 0.5, size: [3, 9], behavior: 'wave' },
  sakura:{ name: '樱花', colors: ['#fd79a8','#e84393','#fab1a0','#ffeaa7'], count: 65, speed: 1.2, size: [3, 6.5], behavior: 'sakura' },
  sword: { name: '御剑', colors: ['#22d3ee','#38bdf8','#60a5fa','#818cf8','#a5b4fc','#c4b5fd'], count: 24, speed: 0.4, size: [6, 9], behavior: 'sword' },
};

function initGlobalParticles() {
  initCardParticleSystems();
  setupGlobalGesture();
  startCardAnimation();
}

// 为每个卡片容器注入独立粒子画布（粒子在卡片局部坐标系绘制，由卡片 overflow:hidden 自然裁剪）
// 支持 .card 与待办堆叠卡片 .stack-3d-card
function initCardParticleSystems() {
  cardParticleSystems.forEach(s => { if (s.canvas && s.canvas.parentNode) s.canvas.parentNode.removeChild(s.canvas); });
  cardParticleSystems = [];
  const cards = document.querySelectorAll('.card, .stack-3d-card');
  cards.forEach((card) => {
    const canvas = document.createElement('canvas');
    canvas.className = 'card-particle-canvas';
    card.insertBefore(canvas, card.firstChild); // 粒子画布置于卡片最底层
    const ctx = canvas.getContext('2d');
    const inst = { el: card, canvas, ctx, particles: [], splashes: [], w: 0, h: 0, _shapePts: null };
    cardParticleSystems.push(inst);
    resizeCardParticleSystem(inst);
    createCardParticles(inst);
  });
}

function resizeCardParticleSystem(inst) {
  const r = inst.el.getBoundingClientRect();
  inst.w = Math.max(1, r.width);
  inst.h = Math.max(1, r.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  inst.canvas.width = inst.w * dpr;
  inst.canvas.height = inst.h * dpr;
  inst.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createCardParticles(inst) {
  const hadShape = inst._shapePts && inst._shapePts.length;
  inst.particles = []; inst.splashes = [];
  // 注意：不清空 _shapePts，避免形状模式下被误重置
  const theme = PARTICLE_THEMES[currentParticleTheme];
  const w = inst.w, h = inst.h;
  // 御剑主题是结构化剑阵，数量不足会散架，移动端也不减半
  // 形状模式下至少保证 80 个粒子（移动端也能看清形状）
  let count;
  if (theme.behavior === 'sword') {
    count = theme.count;
  } else if (hadShape || particleShapeMode !== 'free') {
    count = Math.max(80, w < 300 ? Math.floor(theme.count * 0.5) : theme.count);
  } else {
    count = w < 300 ? Math.floor(theme.count * 0.3) : (window.innerWidth < 768 ? Math.floor(theme.count * 0.5) : theme.count);
  }
  for (let i = 0; i < count; i++) inst.particles.push(createParticle(theme, w, h, i, count));
  // 如果之前有形状，重新分配目标点
  if (hadShape) assignShapeTargetsForInst(inst);
}

let _gResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_gResizeTimer);
  _gResizeTimer = setTimeout(() => { for (const inst of cardParticleSystems) { resizeCardParticleSystem(inst); createCardParticles(inst); } }, 200);
});

function createParticle(theme, w, h, idx, total) {
  const base = {
    color: theme.colors[Math.floor(Math.random() * theme.colors.length)],
    alpha: Math.random() * 0.5 + 0.5,
    phase: Math.random() * Math.PI * 2,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.04,
    affected: false, affectedTimer: 0, depth: Math.random(),
  };
  if (theme.behavior === 'sword') {
    // 飞剑默认散开乱跑：独立速度+位置，3D 深度（0=远 1=近）
    const depth = Math.random();
    return Object.assign(base, {
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      depth,
      size: theme.size[0] + depth * (theme.size[1] - theme.size[0]),
      // 3D 倾斜：俯仰角(pitch)+偏航角(yaw)模拟立体旋转
      pitch: Math.random() * Math.PI * 2,
      yaw: Math.random() * Math.PI * 2,
      pitchSpeed: (Math.random() - 0.5) * 0.04,
      yawSpeed: (Math.random() - 0.5) * 0.05,
      // 聚拢模式用：目标位置插值
      gather: 0,
      gatherX: 0, gatherY: 0,
    });
  }
  return Object.assign(base, {
    x: Math.random() * w, y: Math.random() * h,
    vx: (Math.random() - 0.5) * theme.speed,
    vy: Math.random() * theme.speed * 0.5 + 0.2,
    size: Math.random() * (theme.size[1] - theme.size[0]) + theme.size[0],
  });
}

function setupGlobalGesture() {
  if (window._gGestureBound) return; window._gGestureBound = true;
  window.addEventListener('mousemove', (e) => {
    pointer.prevX = pointer.x; pointer.prevY = pointer.y;
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.vx = pointer.x - pointer.prevX; pointer.vy = pointer.y - pointer.prevY;
    pointer.active = true;
    // 御剑主题：鼠标移动即聚拢飞剑到指针位置（未开摄像头时）
    if (currentParticleTheme === 'sword' && !gestureCam.on) {
      swordCenter.tx = pointer.x; swordCenter.ty = pointer.y; swordCenter.active = true;
      swordCenter.spread = 0.7;
    }
  });
  window.addEventListener('mouseleave', () => {
    pointer.active = false;
    if (currentParticleTheme === 'sword' && !gestureCam.on) swordCenter.active = false;
  });
  window.addEventListener('click', (e) => { if (currentParticleTheme !== 'sword') applyTapEffect(e.clientX, e.clientY); });
  window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY;
      pointer.prevX = pointer.x; pointer.prevY = pointer.y;
      pointer.active = true; pointer.downTime = Date.now();
      // 御剑主题：触摸即聚拢
      if (currentParticleTheme === 'sword' && !gestureCam.on) {
        swordCenter.tx = pointer.x; swordCenter.ty = pointer.y; swordCenter.active = true;
        swordCenter.spread = 0.7;
      }
    }
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && pointer.active) {
      pointer.prevX = pointer.x; pointer.prevY = pointer.y;
      pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY;
      pointer.vx = pointer.x - pointer.prevX; pointer.vy = pointer.y - pointer.prevY;
      if (currentParticleTheme === 'sword' && !gestureCam.on) {
        swordCenter.tx = pointer.x; swordCenter.ty = pointer.y; swordCenter.active = true;
        swordCenter.spread = 0.7;
      }
    }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    const sp = Math.hypot(pointer.vx, pointer.vy);
    const el = Date.now() - pointer.downTime;
    if (currentParticleTheme !== 'sword') {
      if (el < 250 && sp < 8) applyTapEffect(pointer.x, pointer.y);
      else if (sp > 6) applySwipeEffect(pointer.x, pointer.y, pointer.vx, pointer.vy);
    }
    pointer.active = false;
    // 御剑主题：手离开即散开
    if (currentParticleTheme === 'sword' && !gestureCam.on) swordCenter.active = false;
  }, { passive: true });
}

function applyTapEffect(clientX, clientY) {
  const radius = 130;
  for (const inst of cardParticleSystems) {
    const rect = inst.el.getBoundingClientRect();
    const lx = clientX - rect.left, ly = clientY - rect.top;
    if (lx < -radius || lx > inst.w + radius || ly < -radius || ly > inst.h + radius) continue;
    for (let p of inst.particles) {
      const dist = Math.hypot(p.x - lx, p.y - ly);
      if (dist < radius) {
        const angle = Math.atan2(p.y - ly, p.x - lx);
        const force = (radius - dist) / radius * 9;
        p.vx += Math.cos(angle) * force; p.vy += Math.sin(angle) * force;
        p.affected = true; p.affectedTimer = 30;
      }
    }
  }
}

function applySwipeEffect(clientX, clientY, vx, vy) {
  const radius = 160;
  for (const inst of cardParticleSystems) {
    const rect = inst.el.getBoundingClientRect();
    const lx = clientX - rect.left, ly = clientY - rect.top;
    if (lx < -radius || lx > inst.w + radius || ly < -radius || ly > inst.h + radius) continue;
    for (let p of inst.particles) {
      const dist = Math.hypot(p.x - lx, p.y - ly);
      if (dist < radius) {
        const force = (radius - dist) / radius * 6;
        p.vx += vx * force * 0.12; p.vy += vy * force * 0.12;
        p.affected = true; p.affectedTimer = 22;
      }
    }
  }
}

function startCardAnimation() {
  if (globalAnimFrame) cancelAnimationFrame(globalAnimFrame);
  const fps = window.innerWidth < 768 ? 30 : 60;
  const interval = 1000 / fps;
  let lastTime = 0;
  function animate(time) {
    globalAnimFrame = requestAnimationFrame(animate);
    if (time - lastTime < interval) return;
    lastTime = time;
    const theme = PARTICLE_THEMES[currentParticleTheme];
    const winW = window.innerWidth, winH = window.innerHeight;
    // pointer 影响：每帧对每个卡片转换局部坐标（御剑/雨滴主题除外）
    if (pointer.active && theme.behavior !== 'sword' && theme.behavior !== 'rain') handlePointerInfluence();
    // 御剑主题：剑心平滑跟随手势/指针位置（全局坐标）
    if (theme.behavior === 'sword' && swordCenter.active) {
      swordCenter.x += (swordCenter.tx - swordCenter.x) * 0.18;
      swordCenter.y += (swordCenter.ty - swordCenter.y) * 0.18;
    }
    for (const inst of cardParticleSystems) {
      if (!inst.canvas || !inst.ctx || inst.w === 0) continue;
      const ctx = inst.ctx, w = inst.w, h = inst.h;
      ctx.fillStyle = theme.behavior === 'rain' ? 'rgba(6,8,14,0.28)' : 'rgba(6,8,14,0.16)';
      ctx.fillRect(0, 0, w, h);
      // 御剑主题：仅当剑心落在卡片内时，该卡片飞剑才聚拢（否则自由散开）
      let swordLocalX = 0, swordLocalY = 0;
      inst._swordAttract = false;
      if (theme.behavior === 'sword' && swordCenter.active) {
        const cardRect = inst.el.getBoundingClientRect();
        const lx = swordCenter.x - cardRect.left;
        const ly = swordCenter.y - cardRect.top;
        if (lx >= -10 && lx <= w + 10 && ly >= -10 && ly <= h + 10) {
          inst._swordAttract = true;
          swordLocalX = lx; swordLocalY = ly;
        }
      }
      for (let p of inst.particles) { updateParticle(p, theme, w, h, swordLocalX, swordLocalY, inst); drawParticle(ctx, p, theme); }
      drawSplashesForInst(ctx, inst);
      // 御剑主题：仅在该卡片被聚拢时显示剑心
      if (theme.behavior === 'sword' && inst._swordAttract) drawSwordCenterLocal(ctx, swordLocalX, swordLocalY);
    }
  }
  globalAnimFrame = requestAnimationFrame(animate);
}

function handlePointerInfluence() {
  const radius = 150;
  for (const inst of cardParticleSystems) {
    const rect = inst.el.getBoundingClientRect();
    const lx = pointer.x - rect.left, ly = pointer.y - rect.top;
    if (lx < -radius || lx > inst.w + radius || ly < -radius || ly > inst.h + radius) continue;
    for (let p of inst.particles) {
      const dist = Math.hypot(p.x - lx, p.y - ly);
      if (dist > radius) continue;
      const influence = (radius - dist) / radius;
      p.vx += (lx - p.x) * influence * 0.05;
      p.vy += (ly - p.y) * influence * 0.05;
      p.affected = true; p.affectedTimer = 14;
    }
  }
}

function drawConnectionsForInst(ctx, inst) {
  const ps = inst.particles, maxDist = 90;
  for (let i = 0; i < ps.length; i++) {
    for (let j = i + 1; j < ps.length; j++) {
      const p1 = ps[i], p2 = ps[j];
      const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (dist < maxDist) {
        ctx.save();
        ctx.globalAlpha = (1 - dist / maxDist) * 0.22;
        ctx.strokeStyle = p1.color; ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.restore();
      }
    }
  }
}

function updateParticle(p, theme, w, h, swordX, swordY, inst) {
  p.phase += 0.02; p.rot += p.rotSpeed;
  if (p.affected) { p.affectedTimer--; if (p.affectedTimer <= 0) { p.affected = false; p.vx *= 0.5; p.vy *= 0.5; } }
  p.vx *= 0.98; p.vy *= 0.98;
  // 形态模式：粒子缓动聚成数字/I❤U，绕目标点松散漂浮（御剑主题除外）
  if (particleShapeMode !== 'free' && inst && inst._shapePts && inst._shapePts.length && theme.behavior !== 'sword') {
    // 缓动趋向目标点（较弱，保留漂浮感）
    p.x += (p.tx - p.x) * 0.06;
    p.y += (p.ty - p.y) * 0.06;
    // 绕目标点做圆周漂浮，形成松散光晕而非死钉一点
    if (p.orbitR) {
      p.orbitPhase += p.orbitSpeed || 0.02;
      p.x += Math.cos(p.orbitPhase) * p.orbitR * 0.04;
      p.y += Math.sin(p.orbitPhase) * p.orbitR * 0.04;
    }
    p.phase += 0.03;
    // 通透感：降低不透明度，避免密实一团
    p.alpha = 0.45 + Math.sin(p.phase * 1.5) * 0.2;
    if (particleShapeMode === 'heart') { p.alpha = Math.min(p.alpha + 0.15, 0.95); }
    return;
  }
  const depth = 0.5 + p.depth;
  switch (theme.behavior) {
    case 'float': p.x += p.vx + Math.sin(p.phase) * 0.3; p.y += p.vy + Math.cos(p.phase) * 0.2;
      if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); } if (p.x > w) { p.x = w; p.vx = -Math.abs(p.vx); }
      if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); } if (p.y > h) { p.y = h; p.vy = -Math.abs(p.vy); } break;
    case 'rain': p.y += p.vy * 5 + 6 * depth; p.x += Math.sin(p.phase) * 0.5 + p.vx + 0.3;
      if (p.y > h) { p.y = -Math.random() * 30 - 5; p.x = Math.random() * w; p.vy = 0; if (Math.random() < 0.2 && inst) spawnSplash(inst, p.x, h - 2); }
      if (p.x < -5) p.x = w + 5; if (p.x > w + 5) p.x = -5; break;
    case 'snow': p.y += p.vy + 1 * depth; p.x += Math.sin(p.phase) * 1.5 + p.vx;
      if (p.y > h) { p.y = -10; p.x = Math.random() * w; p.vy = 0; }
      if (p.x < 0) p.x = 0; if (p.x > w) p.x = w; break;
    case 'wander': p.x += p.vx + Math.sin(p.phase) * 1; p.y += p.vy + Math.cos(p.phase * 0.7) * 1;
      if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); } if (p.x > w) { p.x = w; p.vx = -Math.abs(p.vx); }
      if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); } if (p.y > h) { p.y = h; p.vy = -Math.abs(p.vy); } break;
    case 'wave': p.x += p.vx; p.y += Math.sin(p.phase + p.x * 0.01) * 2 + p.vy;
      if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); } if (p.x > w) { p.x = w; p.vx = -Math.abs(p.vx); }
      if (p.y < 0) { p.y = 0; } if (p.y > h) { p.y = h; } break;
    case 'sakura': p.y += p.vy + 1; p.x += Math.sin(p.phase) * 2 + p.vx; p.phase += 0.01;
      if (p.y > h) { p.y = -10; p.x = Math.random() * w; p.vy = 0; }
      if (p.x < 0) p.x = 0; if (p.x > w) p.x = w; break;
    case 'sword':
      // 3D 姿态持续更新（俯仰+偏航）
      p.pitch += p.pitchSpeed;
      p.yaw += p.yawSpeed;
      // 跟随强度：指针/手势落在卡片内时飞剑飞向手指聚集跟随，否则散开
      const tgtG = (inst && inst._swordAttract) ? 1 : 0;
      p.gather += (tgtG - p.gather) * 0.08;
      if (p.gather > 0.02 && inst && inst._swordAttract) {
        // 飞向手指：飞剑从当前位置飞向手指位置聚集跟随
        // 小幅随机偏移让聚集松散自然（非整齐剑阵）
        if (p.offX === undefined) { p.offX = (Math.random() - 0.5) * 20; p.offY = (Math.random() - 0.5) * 20; }
        p.offX += Math.sin(p.phase) * 0.15; p.offY += Math.cos(p.phase * 0.7) * 0.15;
        p.phase += 0.02;
        const tx = swordX + p.offX;
        const ty = swordY + p.offY;
        // 飞向手指位置（跟随）
        p.x += (tx - p.x) * 0.14;
        p.y += (ty - p.y) * 0.14;
        // 剑尖朝向手指方向：从飞剑位置指向手指的向量角度
        // 剑身坐标系剑尖在 -y，旋转角 = atan2(手指-飞剑的x, 飞剑-手指的y)
        const dx = swordX - p.x;
        const dy = swordY - p.y;
        p.rot = Math.atan2(dx, -dy);
      } else {
        // 默认散开乱跑：参考 wander 主题，sin/cos 波动飘动 + 边界反弹
        p.x += p.vx + Math.sin(p.phase) * 0.9;
        p.y += p.vy + Math.cos(p.phase * 0.7) * 0.9;
        p.phase += 0.02;
        const m = 12;
        if (p.x < m) { p.x = m; p.vx = Math.abs(p.vx); }
        if (p.x > w - m) { p.x = w - m; p.vx = -Math.abs(p.vx); }
        if (p.y < m) { p.y = m; p.vy = Math.abs(p.vy); }
        if (p.y > h - m) { p.y = h - m; p.vy = -Math.abs(p.vy); }
        // 朝向运动方向，自然真实
        p.rot = Math.atan2(p.vy + Math.cos(p.phase * 0.7), p.vx + Math.sin(p.phase)) + Math.PI / 2;
      }
      break;
  }
  if (theme.behavior !== 'sword') {
    if (p.affected) p.alpha = Math.min(p.alpha + 0.05, 1); else p.alpha = Math.max(p.alpha - 0.01, 0.3);
  }
}

function spawnSplash(inst, x, y) {
  for (let i = 0; i < 3; i++) inst.splashes.push({ x: x + (Math.random()-0.5)*4, y, vx: (Math.random()-0.5)*2.2, vy: -Math.random()*2.5, life: 14, size: Math.random()*1.5+0.5 });
}

function drawSplashesForInst(ctx, inst) {
  const splashes = inst.splashes;
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.3; s.life--;
    if (s.life <= 0) { splashes.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = s.life / 14 * 0.6; ctx.fillStyle = '#a8d8ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

function drawParticle(ctx, p, theme) {
  ctx.save(); ctx.globalAlpha = p.alpha;
  if (theme.behavior === 'sword') {
    // 3D 视觉：深度越近越大越亮，越远越小越暗（透视感）
    const depthScale = 0.5 + p.depth * 0.7;        // 0.5~1.2
    const depthAlpha = 0.35 + p.depth * 0.65;       // 0.35~1.0
    ctx.globalAlpha = p.alpha * depthAlpha;
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    // 3D 倾斜：用 pitch 模拟俯仰（绕水平轴翻转），scaleY 实现透视压扁
    const pitchScale = Math.abs(Math.cos(p.pitch)) * 0.7 + 0.3; // 0.3~1.0
    ctx.scale(depthScale, depthScale * pitchScale);
    const L = p.size * 8;
    const bladeLen = L * 0.78;
    const bladeW = 2.8;
    const t = Date.now() * 0.001;
    // 深度阴影：近处投影更深，远处更淡，增强立体层次
    ctx.shadowBlur = 6 + p.depth * 8; ctx.shadowColor = p.color;
    // 1. 等离子粒子拖尾（剑尖后方粒子流）
    ctx.shadowBlur = 8; ctx.shadowColor = p.color;
    for (let i = 0; i < 5; i++) {
      const ti = i / 5;
      const ty = -L / 2 - 4 - ti * 16;
      ctx.globalAlpha = (1 - ti) * 0.4 * p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(Math.sin(t * 3 + i + p.phase) * 1.5, ty, (1 - ti) * 1.4 + 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = p.alpha;
    // 2. 能量光刃外辉光（大范围柔光层）
    ctx.shadowBlur = 18; ctx.shadowColor = p.color;
    const glowGrad = ctx.createLinearGradient(0, -L / 2, 0, -L / 2 + bladeLen);
    glowGrad.addColorStop(0, '#ffffff');
    glowGrad.addColorStop(0.3, p.color);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad; ctx.globalAlpha = p.alpha * 0.45;
    ctx.beginPath();
    ctx.moveTo(0, -L / 2 - 2);
    ctx.lineTo(bladeW * 1.9, -L / 2 + bladeLen * 0.2);
    ctx.lineTo(bladeW * 1.3, -L / 2 + bladeLen * 0.9);
    ctx.lineTo(-bladeW * 1.3, -L / 2 + bladeLen * 0.9);
    ctx.lineTo(-bladeW * 1.9, -L / 2 + bladeLen * 0.2);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = p.alpha;
    // 3. 能量光刃主体（棱角几何造型，半透明发光）
    ctx.shadowBlur = 10; ctx.shadowColor = p.color;
    const bladeGrad = ctx.createLinearGradient(-bladeW, 0, bladeW, 0);
    bladeGrad.addColorStop(0, 'rgba(255,255,255,0.25)');
    bladeGrad.addColorStop(0.5, '#ffffff');
    bladeGrad.addColorStop(1, 'rgba(255,255,255,0.25)');
    ctx.fillStyle = bladeGrad;
    ctx.beginPath();
    ctx.moveTo(0, -L / 2 - 3);
    ctx.lineTo(bladeW, -L / 2 + bladeLen * 0.12);
    ctx.lineTo(bladeW * 0.65, -L / 2 + bladeLen * 0.4);
    ctx.lineTo(bladeW * 0.8, -L / 2 + bladeLen * 0.82);
    ctx.lineTo(bladeW * 0.55, -L / 2 + bladeLen);
    ctx.lineTo(-bladeW * 0.55, -L / 2 + bladeLen);
    ctx.lineTo(-bladeW * 0.8, -L / 2 + bladeLen * 0.82);
    ctx.lineTo(-bladeW * 0.65, -L / 2 + bladeLen * 0.4);
    ctx.lineTo(-bladeW, -L / 2 + bladeLen * 0.12);
    ctx.closePath(); ctx.fill();
    // 4. 能量核心线（中央发光脊）+ 流动光点
    ctx.shadowBlur = 6; ctx.shadowColor = '#ffffff';
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -L / 2); ctx.lineTo(0, -L / 2 + bladeLen); ctx.stroke();
    // 能量流动光点（沿剑脊上下移动）
    const flowT = (t + p.phase * 0.5) % 1;
    const flowY = -L / 2 + flowT * bladeLen;
    ctx.fillStyle = p.color; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(0, flowY, 1.8, 0, Math.PI * 2); ctx.fill();
    // 5. 六边形科技护手 + 能量核心
    ctx.shadowBlur = 8; ctx.shadowColor = p.color;
    const guardY = -L / 2 + bladeLen;
    const gw = 6;
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = p.color; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, guardY - 3);
    ctx.lineTo(gw, guardY - 1);
    ctx.lineTo(gw, guardY + 3);
    ctx.lineTo(0, guardY + 5);
    ctx.lineTo(-gw, guardY + 3);
    ctx.lineTo(-gw, guardY - 1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 护手能量核心（径向渐变宝石）
    ctx.shadowBlur = 8; ctx.shadowColor = p.color;
    const coreGrad = ctx.createRadialGradient(0, guardY + 1, 0, 0, guardY + 1, 2.5);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.5, p.color);
    coreGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(0, guardY + 1, 2.5, 0, Math.PI * 2); ctx.fill();
    // 6. 暗金属剑柄 + 发光纹路
    ctx.shadowBlur = 0;
    const hiltLen = L * 0.22;
    const hiltGrad = ctx.createLinearGradient(-2, 0, 2, 0);
    hiltGrad.addColorStop(0, '#0f172a');
    hiltGrad.addColorStop(0.5, '#334155');
    hiltGrad.addColorStop(1, '#0f172a');
    ctx.fillStyle = hiltGrad;
    ctx.fillRect(-2, guardY + 2, 4, hiltLen);
    // 剑柄横向能量纹路
    ctx.strokeStyle = p.color; ctx.lineWidth = 0.6;
    ctx.shadowBlur = 4; ctx.shadowColor = p.color; ctx.globalAlpha = p.alpha * 0.8;
    for (let i = 0; i < 3; i++) {
      const yy = guardY + 4 + i * (hiltLen / 3);
      ctx.beginPath(); ctx.moveTo(-1.5, yy); ctx.lineTo(1.5, yy); ctx.stroke();
    }
    ctx.globalAlpha = p.alpha;
    // 7. 剑首能量核心球（脉冲发光）
    const pommelY = guardY + 2 + hiltLen + 2;
    const pulse = 0.7 + Math.sin(t * 5 + p.phase) * 0.3;
    ctx.shadowBlur = 12 * pulse; ctx.shadowColor = p.color;
    const pomGrad = ctx.createRadialGradient(0, pommelY, 0, 0, pommelY, 3);
    pomGrad.addColorStop(0, '#ffffff');
    pomGrad.addColorStop(0.4, p.color);
    pomGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = pomGrad;
    ctx.beginPath(); ctx.arc(0, pommelY, 3 * pulse, 0, Math.PI * 2); ctx.fill();
    // 8. 环绕能量粒子（剑身周围微小光点）
    ctx.shadowBlur = 4; ctx.shadowColor = p.color;
    for (let i = 0; i < 3; i++) {
      const ang = t * 2 + p.phase + i * (Math.PI * 2 / 3);
      const r = 3 + Math.sin(t + i + p.phase) * 1.2;
      ctx.globalAlpha = p.alpha * 0.5;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * r, -L / 4 + Math.sin(ang) * r, 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = p.alpha;
  } else if (theme.behavior === 'rain') {
    const len = 10 + p.vy * 5;
    const tilt = 3; // 雨滴倾斜角度
    const grad = ctx.createLinearGradient(p.x - tilt, p.y - len, p.x + tilt, p.y);
    grad.addColorStop(0, 'rgba(168,216,255,0)');
    grad.addColorStop(0.7, p.color);
    grad.addColorStop(1, p.color);
    ctx.strokeStyle = grad; ctx.lineWidth = p.size * 0.7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x - tilt, p.y - len); ctx.lineTo(p.x + tilt, p.y); ctx.stroke();
  } else if (theme.behavior === 'snow') {
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.shadowBlur = p.size; ctx.shadowColor = '#ffffff';
    ctx.fillStyle = p.color;
    const r = p.size;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  } else if (theme.behavior === 'sakura') {
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.shadowBlur = 0; ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    const r = p.size;
    for (let i = 0; i < 5; i++) {
      ctx.rotate(Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.6, r * 0.4, r * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffeaa7'; ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fill();
  } else if (theme.behavior === 'wave') {
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
    grad.addColorStop(0, p.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2); ctx.fill();
  } else {
    const isHeart = particleShapeMode === 'heart';
    const inShape = particleShapeMode !== 'free';
    // 形态模式下用放大的 shapeSize，更通透不拥挤
    const baseSize = inShape ? (p.shapeSize || p.size * 1.6) : p.size;
    const heartColor = isHeart ? ['#ff4d6d','#ff8fa3','#ffb3c1','#c9184a','#ff758f'][Math.floor(p.phase) % 5] : p.color;
    const twinkle = theme.behavior === 'float' ? (0.6 + Math.sin(p.phase * 3) * 0.4) : 1;
    const heartPulse = isHeart ? (1 + Math.sin(p.phase * 2) * 0.4) : 1;
    ctx.shadowBlur = isHeart ? baseSize * 8 : baseSize * 3;
    ctx.shadowColor = heartColor;
    ctx.globalAlpha = p.alpha * twinkle;
    ctx.beginPath(); ctx.arc(p.x, p.y, baseSize * heartPulse, 0, Math.PI * 2);
    ctx.fillStyle = heartColor; ctx.fill();
    if (theme.behavior === 'float' && baseSize > 1.8 && !isHeart && !inShape) {
      ctx.globalAlpha = p.alpha * twinkle * 0.5;
      ctx.strokeStyle = p.color; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.moveTo(p.x - baseSize * 2.5, p.y); ctx.lineTo(p.x + baseSize * 2.5, p.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x, p.y - p.size * 2.5); ctx.lineTo(p.x, p.y + p.size * 2.5); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSwordCenterLocal(ctx, x, y) {
  ctx.save();
  const t = Date.now() / 1000;
  const pulse = 1 + Math.sin(t * 3) * 0.15;
  // 外层柔光
  const grad1 = ctx.createRadialGradient(x, y, 0, x, y, 48 * pulse);
  grad1.addColorStop(0, 'rgba(96,165,250,0.5)');
  grad1.addColorStop(0.5, 'rgba(96,165,250,0.18)');
  grad1.addColorStop(1, 'transparent');
  ctx.fillStyle = grad1; ctx.beginPath(); ctx.arc(x, y, 48 * pulse, 0, Math.PI * 2); ctx.fill();
  // 能量环（旋转的双圈）
  ctx.strokeStyle = 'rgba(147,197,253,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 22, t * 1.5, t * 1.5 + Math.PI * 1.4); ctx.stroke();
  ctx.strokeStyle = 'rgba(196,181,253,0.5)';
  ctx.beginPath(); ctx.arc(x, y, 30, -t * 1.2, -t * 1.2 + Math.PI * 1.2); ctx.stroke();
  // 内核辉光
  const grad2 = ctx.createRadialGradient(x, y, 0, x, y, 12);
  grad2.addColorStop(0, '#ffffff');
  grad2.addColorStop(0.4, '#bfdbfe');
  grad2.addColorStop(1, 'rgba(96,165,250,0)');
  ctx.fillStyle = grad2; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
  // 中心实点
  ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 12; ctx.shadowColor = '#60a5fa';
  ctx.beginPath(); ctx.arc(x, y, 4 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function switchParticleTheme(themeName) {
  if (!PARTICLE_THEMES[themeName]) return;
  currentParticleTheme = themeName;
  particleShapeMode = 'free'; shapePoints = [];
  _lastFingerMode = 'free';
  // 持久化到设置，刷新/切页后保持
  appData.settings.particleTheme = themeName;
  saveData();
  // 重新初始化所有卡片画布并重建粒子，确保当前页面所有 .card 同步生效
  initCardParticleSystems();
  toast('已切换到 ' + PARTICLE_THEMES[themeName].name + ' 主题', 'success');
}

// ===================== 粒子形态（数字 / I❤U）文字采样（按卡片尺寸生成目标点） =====================
const _shapeCanvas = document.createElement('canvas');
function getTextPoints(text, w, h) {
  _shapeCanvas.width = w; _shapeCanvas.height = h;
  const c = _shapeCanvas.getContext('2d');
  c.clearRect(0, 0, w, h);
  // 字体放大让形状舒展（单字符更大，多字符适中）
  const fontSize = Math.min(w, h) * (text.length > 2 ? 0.45 : 0.72);
  c.fillStyle = '#fff';
  c.font = 'bold ' + fontSize + 'px -apple-system, "PingFang SC", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, w / 2, h / 2);
  const img = c.getImageData(0, 0, w, h).data;
  const pts = [];
  // 采样步长减小，确保细笔画（如数字1）也能采到足够点
  const step = w < 300 ? 6 : (w < 768 ? 7 : 8);
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      if (img[(y * w + x) * 4 + 3] > 64) pts.push({ x, y });
    }
  }
  return pts;
}

function setParticleShape(mode) {
  console.log('[手势调试] setParticleShape 被调用，mode=', mode, '当前 particleShapeMode=', particleShapeMode);
  if (mode === particleShapeMode) { console.log('[手势调试] 模式相同，跳过'); return; }
  particleShapeMode = mode;
  if (mode === 'free') {
    shapePoints = [];
    // 退出形态模式，重建原始数量的粒子恢复自由飘动
    for (const inst of cardParticleSystems) createCardParticles(inst);
    console.log('[手势调试] 已切换到自由模式');
    return;
  }
  const text = mode === 'heart' ? 'I ♥ U' : mode;
  console.log('[手势调试] 生成文字:', text, '卡片数量:', cardParticleSystems.length);
  for (const inst of cardParticleSystems) {
    const pts = getTextPoints(text, inst.w, inst.h);
    inst._shapePts = pts;
    console.log('[手势调试] 卡片尺寸', inst.w, 'x', inst.h, '采样点数:', pts.length);
    // 补充粒子到接近采样点数，让数字/I♥U 形状饱满（上限 300）
    // 采样点太少时至少保证 60 个粒子，避免形状不清晰
    const target = Math.max(Math.min(pts.length, 300), 60);
    const theme = PARTICLE_THEMES[currentParticleTheme];
    while (inst.particles.length < target) {
      inst.particles.push(createParticle(theme, inst.w, inst.h, inst.particles.length, target));
    }
    assignShapeTargetsForInst(inst);
  }
  console.log('[手势调试] 形状设置完成，particleShapeMode=', particleShapeMode);
}

function assignShapeTargetsForInst(inst) {
  const pts = inst._shapePts;
  if (!pts || !pts.length) return;
  for (let i = 0; i < inst.particles.length; i++) {
    const p = inst.particles[i];
    const t = pts[i % pts.length];
    // 目标点加大随机散布范围，粒子围绕目标点漂浮而非死钉一点
    p.tx = t.x + (Math.random() - 0.5) * 14;
    p.ty = t.y + (Math.random() - 0.5) * 14;
    // 每个粒子独立的漂浮半径和相位，形成松散的"光晕"效果
    p.orbitR = 3 + Math.random() * 8;
    p.orbitPhase = Math.random() * Math.PI * 2;
    p.orbitSpeed = 0.015 + Math.random() * 0.02;
    // 形态模式下粒子放大，更通透不拥挤
    p.shapeSize = (p.size || 1.5) * 1.6;
  }
}

// ===================== MediaPipe Hands 手势识别（手势控制粒子布局） =====================
async function toggleGestureCam() {
  if (gestureCam.on) { stopGestureCam(); return; }
  setGestureHint('正在初始化…');
  try {
    gestureCam.video = document.getElementById('aiGestureVideo');
    if (!gestureCam.video) { toast('请先进入AI对话助手页面', 'error'); return; }
    // 等 Hands 库就绪（移动端 CDN 加载较慢）
    let waited = 0;
    while (typeof Hands === 'undefined' && waited < 8000) { await new Promise(r => setTimeout(r, 200)); waited += 200; }
    if (typeof Hands === 'undefined') { toast('手势库加载失败，请检查网络后重试', 'error'); setGestureHint('手势库未加载'); return; }
    setGestureHint('请求摄像头…');
    const isMobile = window.innerWidth < 768;
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: isMobile ? 480 : 640 }, height: { ideal: isMobile ? 360 : 480 } }, audio: false });
    gestureCam.video.srcObject = stream;
    gestureCam.video.setAttribute('playsinline', '');
    gestureCam.video.muted = true;
    await gestureCam.video.play().catch(() => {});
    // 等待视频真正就绪（移动端 video.play() 返回后帧未必就绪）
    setGestureHint('等待视频就绪…');
    await new Promise((resolve) => {
      const v = gestureCam.video;
      if (v.readyState >= 2 && v.videoWidth > 0) return resolve();
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      v.addEventListener('loadeddata', finish, { once: true });
      v.addEventListener('canplay', finish, { once: true });
      setTimeout(finish, 3000); // 兜底 3 秒
    });
    // 创建 canvas 中间层（移动端直接传 video 给 MediaPipe 常提取不到帧）
    if (!gestureCam.bridge) {
      gestureCam.bridge = document.createElement('canvas');
      gestureCam.bridgeCtx = gestureCam.bridge.getContext('2d');
    }
    setGestureHint('加载手势模型…');
    gestureCam.hands = new Hands({ locateFile: (f) => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f });
    // 移动端用 modelComplexity:0 避免卡死，桌面端用 1 更精准
    gestureCam.hands.setOptions({ selfieMode: true, maxNumHands: 1, modelComplexity: isMobile ? 0 : 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
    gestureCam.hands.onResults(onHandsResults);
    gestureCam.on = true;
    const panel = document.getElementById('aiGesturePanel');
    if (panel) panel.classList.remove('closed');
    const btn = document.getElementById('aiGestureToggle');
    if (btn) btn.textContent = '📹 关闭手势';
    setGestureHint(currentParticleTheme === 'sword' ? '移动手控制剑阵' : '比 1-5 指改变粒子');
    toast('摄像头已开启，手势控制粒子布局', 'success');
    gestureCamLoop();
  } catch (err) {
    console.error('手势识别初始化失败', err);
    let msg = err.message || err.name || '未知错误';
    if (err.name === 'NotAllowedError') msg = '摄像头权限被拒绝，请在浏览器设置中允许';
    else if (err.name === 'NotFoundError') msg = '未找到摄像头设备';
    else if (err.name === 'NotReadableError') msg = '摄像头被其他应用占用';
    toast('手势识别失败：' + msg, 'error');
    setGestureHint('开启失败：' + msg);
    stopGestureCam();
  }
}

function stopGestureCam() {
  gestureCam.on = false;
  if (gestureCam.raf) cancelAnimationFrame(gestureCam.raf);
  if (gestureCam.video && gestureCam.video.srcObject) {
    gestureCam.video.srcObject.getTracks().forEach(t => t.stop());
    gestureCam.video.srcObject = null;
  }
  gestureCam.hands = null; swordCenter.active = false;
  _fingerHistory = []; _lastFingerMode = 'free'; _lastSwitchTime = 0; _detectCount = 0;
  const panel = document.getElementById('aiGesturePanel');
  if (panel) panel.classList.add('closed');
  const btn = document.getElementById('aiGestureToggle');
  if (btn) btn.textContent = '📹 开启手势';
  setGestureHint('手势识别未开启');
}

function setGestureHint(text) {
  const el = document.getElementById('aiGestureHint');
  if (el) el.textContent = text;
}

// 手势防抖：最近若干帧手指数投票 + 切换时间节流
let _fingerHistory = [];      // 最近帧的手指数
let _lastFingerMode = 'free'; // 上次生效的形态
let _lastSwitchTime = 0;      // 上次切换时间戳
let _detectCount = 0;         // 累计识别到的帧数（诊断用）
function gestureCamLoop() {
  if (!gestureCam.on) return;
  const v = gestureCam.video;
  if (v && v.readyState >= 2 && v.videoWidth > 0 && gestureCam.hands) {
    // 通过 canvas 中间层传给 MediaPipe（移动端直接传 video 常失败）
    try {
      const bw = v.videoWidth, bh = v.videoHeight;
      if (gestureCam.bridge.width !== bw) { gestureCam.bridge.width = bw; gestureCam.bridge.height = bh; }
      gestureCam.bridgeCtx.drawImage(v, 0, 0, bw, bh);
      gestureCam.hands.send({ image: gestureCam.bridge }).then(() => {
        if (gestureCam.on) gestureCam.raf = requestAnimationFrame(gestureCamLoop);
      }).catch((e) => {
        console.warn('hands.send failed', e);
        if (gestureCam.on) gestureCam.raf = requestAnimationFrame(gestureCamLoop);
      });
    } catch (e) {
      console.warn('drawImage failed', e);
      if (gestureCam.on) gestureCam.raf = requestAnimationFrame(gestureCamLoop);
    }
  } else {
    // 视频未就绪，500ms 后重试并提示
    if (!v || !v.videoWidth) setGestureHint('视频未就绪，请稍候…');
    gestureCam.raf = requestAnimationFrame(gestureCamLoop);
  }
}

// 手指弯曲检测：四指用"指尖 y < PIP y"（手朝上时指尖在上方），拇指用指尖与 IP/MCP 横向比较
// 手指伸直检测：基于"指尖相对 PIP 关节向远离掌心方向延伸"
// 用指尖到手腕距离 vs PIP 到手腕距离的比值判断，对手部朝向不敏感
function countFingers(lm) {
  let count = 0;
  const wrist = lm[0];
  // 辅助：点 a 到点 b 的距离
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  // 拇指：拇指尖(4)到手腕距离 vs 拇指MCP(2)到手腕距离
  const thumbTipToWrist = dist(lm[4], wrist);
  const thumbMcpToWrist = dist(lm[2], wrist);
  // 阈值放宽：拇指伸直时尖比 MCP 更远离手腕即可
  if (thumbTipToWrist > thumbMcpToWrist * 1.12) count++;
  // 四指：指尖(tip)比 PIP 关节更远离手腕（向指尖方向延伸）
  // 主要用距离比值判断，不再强制要求手朝上（y更小），适应各种手部角度
  const fingers = [[8, 6], [12, 10], [16, 14], [20, 18]];
  for (const [tip, pip] of fingers) {
    const tipToWrist = dist(lm[tip], wrist);
    const pipToWrist = dist(lm[pip], wrist);
    // 阈值放宽：指尖比 PIP 更远离手腕即可判定伸直
    if (tipToWrist > pipToWrist * 1.03) count++;
  }
  return count;
}

function onHandsResults(results) {
  _detectCount++;
  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    swordCenter.active = false;
    pointer.active = false;
    _fingerHistory = [];
    // 手离开画面时恢复自由形态（仅当当前不是 free）
    if (_lastFingerMode !== 'free') { setParticleShape('free'); _lastFingerMode = 'free'; }
    if (_detectCount % 15 === 0) setGestureHint('识别中…把手放入画面');
    return;
  }
  const lm = results.multiHandLandmarks[0];
  const rawFingers = countFingers(lm);
  // selfieMode 已镜像，直接用原始坐标映射到屏幕
  const wx = lm[0].x * window.innerWidth;
  const wy = lm[0].y * window.innerHeight;

  // 同步更新 pointer，让所有主题的粒子都能响应手势
  pointer.prevX = pointer.x; pointer.prevY = pointer.y;
  pointer.x = wx; pointer.y = wy;
  pointer.vx = pointer.x - pointer.prevX; pointer.vy = pointer.y - pointer.prevY;
  pointer.active = true;

  if (currentParticleTheme === 'sword') {
    // 御剑主题：手腕控制剑阵中心，手张开度控制剑阵半径与转速
    swordCenter.tx = wx; swordCenter.ty = wy; swordCenter.active = true;
    const spread = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
    swordCenter.spread = Math.max(0.15, Math.min(1, spread * 3.2));
    setGestureHint('御剑模式 · 张开度 ' + Math.round(swordCenter.spread * 100) + '%（切换其他主题可用手势）');
    return;
  }

  // 防抖：最近 6 帧手指数投票取众数
  _fingerHistory.push(rawFingers);
  if (_fingerHistory.length > 6) _fingerHistory.shift();
  const freq = {};
  for (const f of _fingerHistory) freq[f] = (freq[f] || 0) + 1;
  let fingers = rawFingers, maxFreq = 0;
  for (const f in freq) { if (freq[f] > maxFreq) { maxFreq = freq[f]; fingers = +f; } }
  // 要求众数占比过半才生效，避免抖动（6帧中至少3帧一致）
  const stable = maxFreq >= 3;

  // 时间节流：距上次切换至少 400ms 才允许切换（且需稳定）
  const now = Date.now();
  const canSwitch = (now - _lastSwitchTime) > 400;

  let targetMode = null, hint = '';
  if (stable && fingers === 5) { targetMode = 'heart'; hint = '5 指 → I ❤ U'; }
  else if (stable && fingers >= 1 && fingers <= 4) { targetMode = String(fingers); hint = fingers + ' 指 → 聚成 ' + fingers; }
  else if (stable && fingers === 0) { targetMode = 'free'; hint = '握拳 → 散开'; }

  // 移动端调试：把关键信息显示在 hint 里
  if (!hint) {
    hint = '指:' + rawFingers + ' 稳:' + (stable ? fingers : '?') + '/' + maxFreq + ' 模:' + (particleShapeMode === 'free' ? '散' : particleShapeMode);
  } else {
    hint = hint + ' [' + rawFingers + '/' + maxFreq + ']';
  }

  if (targetMode && targetMode !== _lastFingerMode && canSwitch) {
    console.log('[手势调试] ✅ 触发切换:', _lastFingerMode, '→', targetMode);
    toast('手势切换：' + (targetMode === 'heart' ? 'I ❤ U' : targetMode === 'free' ? '散开' : '聚成 ' + targetMode), 'success');
    setParticleShape(targetMode);
    _lastFingerMode = targetMode;
    _lastSwitchTime = now;
  }
  setGestureHint(hint);
}

// ===================== 初始化 =====================
function init() {
  // 应用主题
  document.documentElement.style.setProperty('--accent', appData.settings.accentColor);
  document.body.style.fontSize = (appData.settings.fontSize || 14) + 'px';
  
  // marked配置
  marked.setOptions({ breaks: true, gfm: true });

  // 渲染右侧书签
  renderRightBookmarks();

  // 渲染首屏
  renderPage();

  // 从设置恢复已保存的粒子主题
  if (appData.settings.particleTheme && PARTICLE_THEMES[appData.settings.particleTheme]) {
    currentParticleTheme = appData.settings.particleTheme;
  }

  // 初始化全局粒子系统（作用于全部卡片）
  initGlobalParticles();

  // 隐藏启动动画
  setTimeout(() => {
    const splash = document.getElementById('splashScreen');
    if (splash) {
      splash.classList.add('splash-hide');
      setTimeout(() => splash.remove(), 600);
    }
  }, 1500);
}

init();
</script>
